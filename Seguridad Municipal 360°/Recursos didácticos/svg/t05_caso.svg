<circle cx="250" cy="247.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="223" width="900" height="48" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="255.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Un vecino reclama que las calles del centro no están demarcadas</text>
<text x="216.0" y="318.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Quepos, 2008</text>
<circle cx="250" cy="311.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="287" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="319.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala ordena demarcar en seis meses; la calle era municipal</text>
<text x="216.0" y="394.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">La Unión, 2025</text>
<circle cx="250" cy="387.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="351" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="380.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Un hundimiento frente al Cementerio de Tres Ríos; el vecino avisa</text>
<text x="306.0" y="409.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">a la Municipalidad y al CONAVI</text>
<text x="216.0" y="482.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">La Unión, 2025</text>
<circle cx="250" cy="475.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="439" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="468.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Municipalidad pone vallas, inspecciona, insta al CONAVI y</text>
<text x="306.0" y="497.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">activa su comité de emergencias</text>
<text x="216.0" y="570.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">La Unión, 2025</text>
<circle cx="250" cy="563.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="527" width="900" height="72" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="556.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Sin lugar contra la Municipalidad; el CONAVI debe repararlo en</text>
<text x="306.0" y="585.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">seis meses</text>
