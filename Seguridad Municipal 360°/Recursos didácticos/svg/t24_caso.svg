<rect x="286" y="375" width="900" height="48" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="407.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Acude a la Sala Constitucional</text>
<text x="216.0" y="482.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">22 jul 2015</text>
<circle cx="250" cy="475.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="439" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="468.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Municipalidad notifica a los propietarios de Barrio Fátima, con</text>
<text x="306.0" y="497.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">ocasión del amparo</text>
<text x="216.0" y="558.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Sentencia</text>
<circle cx="250" cy="551.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="527" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="559.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala: no se actuó con la eficiencia y celeridad necesarias</text>
<circle cx="52" cy="609" r="11" fill="#B5543A"/>
<text x="70.0" y="616.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Persona o comunidad</text>
