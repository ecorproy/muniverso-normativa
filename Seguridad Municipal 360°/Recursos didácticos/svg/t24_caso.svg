<text x="216.0" y="266.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2012</text>
<circle cx="250" cy="259.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="223" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="252.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Un padre de dos hijos con discapacidad visual denuncia aceras en</text>
<text x="306.0" y="281.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Heredia, con dirección y fotografías</text>
<text x="216.0" y="342.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2012-2015</text>
<circle cx="250" cy="335.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="311" width="900" height="48" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="343.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Tres años de correos sin respuesta para Barrio Fátima</text>
<text x="216.0" y="406.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2015</text>
