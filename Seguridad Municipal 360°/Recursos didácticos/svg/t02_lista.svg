<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="807" viewBox="0 0 1200 807" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2A8C6E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE I. VIDA</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 2</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Salud mental</text>
<rect x="30" y="205" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="234.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Cuida el entorno: licencias, permisos de espectáculos, parques y trato en</text>
<text x="112.0" y="273.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">sus oficinas?</text>
<rect x="30" y="305" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="334.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="344.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Acompaña a las personas en los servicios que ya presta, como el centro</text>
<text x="112.0" y="373.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">diurno o el centro de cuido?</text>
<rect x="30" y="405" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="419.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="444.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Diagnostica los riesgos psicosociales de su propio personal?</text>
<rect x="30" y="476" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="505.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="515.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Coordina la promoción y la prevención con la Secretaría Técnica y las</text>
<text x="112.0" y="544.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">instancias locales?</text>
<rect x="30" y="576" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="590.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="615.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Recoge la palabra de la gente con diagnósticos participativos?</text>
<rect x="30" y="647" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="676.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="686.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Organiza por reglamento lo que paga y lo suma por convenio al de otras</text>
<text x="112.0" y="715.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">instituciones?</text>
<text x="40.0" y="777.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>