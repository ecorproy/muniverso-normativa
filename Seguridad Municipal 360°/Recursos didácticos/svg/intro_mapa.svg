<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1593" viewBox="0 0 1200 1593" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#1F4E79"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">SEGURIDAD MUNICIPAL 360°</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">INTRODUCCIÓN</text>
<text x="40.0" y="140.0" font-size="22" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F4E79">Mapa del viaje</text>
<text x="40.0" y="188.0" font-size="38" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Seis estaciones, de la red a la persona</text>
<circle cx="600" cy="250" r="34" fill="#1E2A38"/>
