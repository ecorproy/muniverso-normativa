<text x="650.0" y="246.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Salida</text>
<text x="650.0" y="274.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una pregunta, octubre de 2016</text>
<line x1="600" y1="284" x2="600" y2="1513" stroke="#6B7480" stroke-width="14" stroke-linecap="round"/>
<line x1="600" y1="284" x2="600" y2="1513" stroke="white" stroke-width="3" stroke-dasharray="16 14"/>
