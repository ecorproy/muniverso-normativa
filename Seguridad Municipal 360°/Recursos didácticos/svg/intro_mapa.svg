<circle cx="600" cy="368" r="30" fill="#4F7942" stroke="white" stroke-width="4"/>
<text x="600.0" y="378.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">1</text>
<text x="84.0" y="364.0" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">ESTACIÓN 1 · BAJO TIERRA</text>
<text x="84.0" y="398.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Capítulo 1. La red</text>
<text x="84.0" y="434.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Casi nada ocurre solo: un caso toca</text>
<text x="84.0" y="459.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">varios temas a la vez.</text>
<line x1="640" y1="494" x2="600" y2="494" stroke="#5B4B8A" stroke-width="4"/>
<rect x="640" y="450" width="500" height="216" rx="16" fill="#E7E2F3" stroke="#5B4B8A" stroke-width="3"/>
<circle cx="600" cy="494" r="30" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<text x="600.0" y="504.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2</text>
<text x="664.0" y="490.0" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#5B4B8A">ESTACIÓN 2 · EL TEXTO</text>
<text x="664.0" y="524.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Capítulo 2. Lo local en el</text>
<text x="664.0" y="554.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">artículo 169</text>
<text x="664.0" y="590.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Lo local es una reserva constitucional</text>
<text x="664.0" y="615.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">sin lista, que se precisa caso por caso.</text>
<line x1="560" y1="650" x2="600" y2="650" stroke="#B07A12" stroke-width="4"/>
<rect x="60" y="606" width="500" height="186" rx="16" fill="#FBEDCF" stroke="#B07A12" stroke-width="3"/>
<circle cx="600" cy="650" r="30" fill="#B07A12" stroke="white" stroke-width="4"/>
<text x="600.0" y="660.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">3</text>
<text x="84.0" y="646.0" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#B07A12">ESTACIÓN 3 · EL CONCEPTO</text>
<text x="84.0" y="680.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Capítulo 3. El concepto</text>
<text x="84.0" y="716.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una definición, una célula y dos</text>
<text x="84.0" y="741.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">personas en su núcleo.</text>
<line x1="640" y1="776" x2="600" y2="776" stroke="#B5543A" stroke-width="4"/>
<rect x="640" y="732" width="500" height="216" rx="16" fill="#F8E2D8" stroke="#B5543A" stroke-width="3"/>
<circle cx="600" cy="776" r="30" fill="#B5543A" stroke="white" stroke-width="4"/>
<text x="600.0" y="786.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">4</text>
<text x="664.0" y="772.0" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#B5543A">ESTACIÓN 4 · LA PERSONA</text>
<text x="664.0" y="806.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Capítulo 4. La persona en el</text>
<text x="664.0" y="836.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">centro</text>
<text x="664.0" y="872.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Qué se deben quien recibe el servicio y</text>
<text x="664.0" y="897.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">quien lo presta.</text>
<line x1="560" y1="932" x2="600" y2="932" stroke="#1E2A38" stroke-width="4"/>
<rect x="60" y="888" width="500" height="409" rx="16" fill="#EEF0F3" stroke="#1E2A38" stroke-width="3"/>
<circle cx="600" cy="932" r="30" fill="#1E2A38" stroke="white" stroke-width="4"/>
<text x="600.0" y="942.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">5</text>
<text x="84.0" y="928.0" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">ESTACIÓN 5 · EL TERRITORIO</text>
<text x="84.0" y="962.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Cuatro cuadrantes, treinta y seis</text>
<text x="84.0" y="992.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">temas</text>
<text x="84.0" y="1028.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Cada tema: el caso, quién manda, normas</text>
<text x="84.0" y="1053.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">y jueces, con qué se paga, cómo se hace</text>
<text x="84.0" y="1078.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">y qué se mide.</text>
<rect x="84" y="1109" width="452" height="32" rx="8" fill="#2A8C6E"/>
<text x="100.0" y="1131.0" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="white">Vida</text>
<text x="520.0" y="1131.0" font-size="17" font-weight="normal" font-style="normal" text-anchor="end" fill="white">temas 1 a 9</text>
