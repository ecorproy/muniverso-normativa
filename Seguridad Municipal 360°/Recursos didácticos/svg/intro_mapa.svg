<text x="100.0" y="1171.0" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="white">Dignidad</text>
<text x="520.0" y="1171.0" font-size="17" font-weight="normal" font-style="normal" text-anchor="end" fill="white">temas 10 a 18</text>
<rect x="84" y="1189" width="452" height="32" rx="8" fill="#C94158"/>
<text x="100.0" y="1211.0" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="white">Protección especial</text>
<text x="520.0" y="1211.0" font-size="17" font-weight="normal" font-style="normal" text-anchor="end" fill="white">temas 19 a 27</text>
<rect x="84" y="1229" width="452" height="32" rx="8" fill="#2F86AE"/>
<text x="100.0" y="1251.0" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="white">Bienestar y entorno</text>
<text x="520.0" y="1251.0" font-size="17" font-weight="normal" font-style="normal" text-anchor="end" fill="white">temas 28 a 36</text>
