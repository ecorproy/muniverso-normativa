<rect x="640" y="1237" width="500" height="186" rx="16" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<circle cx="600" cy="1281" r="30" fill="#1F4E79" stroke="white" stroke-width="4"/>
<text x="600.0" y="1291.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">6</text>
<text x="664.0" y="1277.0" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#1F4E79">ESTACIÓN 6 · EL REGRESO</text>
<text x="664.0" y="1311.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Conclusión. Volver al núcleo</text>
<text x="664.0" y="1347.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Seis preguntas para diagnosticar una</text>
<text x="664.0" y="1372.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">municipalidad, y la séptima.</text>
