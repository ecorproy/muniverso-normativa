<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1164" viewBox="0 0 1200 1164" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="230" fill="#C94158"/>
<circle cx="140" cy="115" r="70" fill="white"/>
<path d="M140,73.0 L175.0,87.0 L175.0,118.5 Q175.0,146.5 140,160.5 Q105.0,146.5 105.0,118.5 L105.0,87.0 Z" fill="#C94158"/>
<path d="M126.0,115 L136.5,127.25 L157.5,102.75" stroke="white" stroke-width="5.95" fill="none" stroke-linecap="round"/>
<text x="250.0" y="95.0" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE III</text>
<text x="250.0" y="150.0" font-size="46" font-weight="bold" font-style="normal" text-anchor="start" fill="white">Protección especial</text>
<text x="250.0" y="192.0" font-size="22" font-weight="normal" font-style="italic" text-anchor="start" fill="white">CP, art. 51 · nueve temas</text>
<text x="40.0" y="270.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#C94158">Las preguntas de este cuadrante</text>
<rect x="30" y="294" width="1140" height="79" rx="10" fill="#F9DFE4"/>
<circle cx="82" cy="333.5" r="30" fill="#C94158"/>
<text x="82.0" y="343.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">19</text>
<text x="140.0" y="328.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Familia</text>
<text x="140.0" y="358.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que la familia esté protegida?</text>
<rect x="30" y="379" width="1140" height="79" rx="10" fill="white"/>
<circle cx="82" cy="418.5" r="30" fill="#C94158"/>
<text x="82.0" y="428.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">20</text>
<text x="140.0" y="413.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Maternidad y primera infancia</text>
<text x="140.0" y="443.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que la madre y el niño pequeño estén protegidos?</text>
<rect x="30" y="464" width="1140" height="79" rx="10" fill="#F9DFE4"/>
<circle cx="82" cy="503.5" r="30" fill="#C94158"/>
<text x="82.0" y="513.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">21</text>
<text x="140.0" y="498.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Niñez</text>
<text x="140.0" y="528.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que los niños del cantón ejerzan sus derechos?</text>
<rect x="30" y="549" width="1140" height="104" rx="10" fill="white"/>
<circle cx="82" cy="601.0" r="30" fill="#C94158"/>
<text x="82.0" y="611.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">22</text>
<text x="140.0" y="583.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Adolescencia y juventud</text>
<text x="140.0" y="613.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que los adolescentes y los jóvenes del cantón</text>
<text x="140.0" y="638.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">ejerzan sus derechos?</text>
<rect x="30" y="659" width="1140" height="104" rx="10" fill="#F9DFE4"/>
<circle cx="82" cy="711.0" r="30" fill="#C94158"/>
<text x="82.0" y="721.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">23</text>
<text x="140.0" y="693.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Personas adultas mayores</text>
<text x="140.0" y="723.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que las personas adultas mayores ejerzan sus</text>
<text x="140.0" y="748.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">derechos?</text>
<rect x="30" y="769" width="1140" height="104" rx="10" fill="white"/>
<circle cx="82" cy="821.0" r="30" fill="#C94158"/>
<text x="82.0" y="831.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">24</text>
<text x="140.0" y="803.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Personas con discapacidad</text>
<text x="140.0" y="833.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que las personas con discapacidad ejerzan sus</text>
<text x="140.0" y="858.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">derechos?</text>
<rect x="30" y="879" width="1140" height="79" rx="10" fill="#F9DFE4"/>
<circle cx="82" cy="918.5" r="30" fill="#C94158"/>
<text x="82.0" y="928.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">25</text>
<text x="140.0" y="913.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Cuido</text>
<text x="140.0" y="943.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que el cuido exista?</text>
<rect x="30" y="964" width="1140" height="79" rx="10" fill="white"/>
<circle cx="82" cy="1003.5" r="30" fill="#C94158"/>
<text x="82.0" y="1013.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">26</text>
<text x="140.0" y="998.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Violencia doméstica</text>
<text x="140.0" y="1028.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que exista la protección?</text>
<rect x="30" y="1049" width="1140" height="79" rx="10" fill="#F9DFE4"/>
<circle cx="82" cy="1088.5" r="30" fill="#C94158"/>
<text x="82.0" y="1098.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">27</text>
<text x="140.0" y="1083.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Convivencia vecinal</text>
<text x="140.0" y="1113.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que exista la convivencia vecinal?</text></svg>