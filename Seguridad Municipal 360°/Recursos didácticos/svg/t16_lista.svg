<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="649" viewBox="0 0 1200 649" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#8A4F9E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE II. DIGNIDAD</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 16</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Intimidad y datos personales</text>
<rect x="30" y="205" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="234.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Trata a cada persona como titular de sus datos, que la municipalidad</text>
<text x="112.0" y="273.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">custodia pero no dispone?</text>
<rect x="30" y="305" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="319.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="344.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Usa cada dato solo para la finalidad con que se recogió?</text>
<rect x="30" y="376" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="390.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="415.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Limita el acceso por función y por caso, incluso para la auditoría?</text>
<rect x="30" y="447" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="461.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="486.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Entrega datos solo por ley, por derecho del titular o por acto motivado?</text>
<rect x="30" y="518" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="532.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="557.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Elimina lo que ya no sirve, como deber y no como opción?</text>
<text x="40.0" y="619.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>