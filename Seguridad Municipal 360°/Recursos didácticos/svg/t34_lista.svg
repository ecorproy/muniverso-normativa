<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="607" viewBox="0 0 1200 607" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2F86AE"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE IV. BIENESTAR Y ENTORNO</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 34</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Cultura y patrimonio</text>
<rect x="30" y="205" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="234.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Tiene inventario de los bienes con valor histórico del cantón, declarados o</text>
<text x="112.0" y="273.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">no, y de sus obras de arte?</text>
<rect x="30" y="305" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="334.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="344.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Ante una obra que pueda afectar un bien con indicios de valor, ¿pide al</text>
<text x="112.0" y="373.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Ministerio el estudio de incorporación?</text>
<rect x="30" y="405" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="419.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="444.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Financia sus escuelas y bandas y otorga becas con reglamento?</text>
<rect x="30" y="476" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="490.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="515.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Usa cada fondo cultural para su fin legal?</text>
<text x="40.0" y="577.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>