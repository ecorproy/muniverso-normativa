<rect x="286" y="375" width="900" height="72" rx="10" fill="white" stroke="#B07A12" stroke-width="2"/>
<text x="306.0" y="404.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Contraloría confirma: las razones de interés público estaban</text>
<text x="306.0" y="433.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">motivadas</text>
