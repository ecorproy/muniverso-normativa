<text x="306.0" y="316.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El Concejo declara desierta la licitación del operador y asume el</text>
<text x="306.0" y="345.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">servicio de forma directa</text>
<text x="216.0" y="418.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Apelación</text>
