<text x="306.0" y="255.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Se inaugura el centro de cuido de Palmares: cincuenta niños</text>
<text x="216.0" y="330.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Ene 2024</text>
