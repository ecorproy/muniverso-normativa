<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#C94158"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE III. PROTECCIÓN ESPECIAL</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 25</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Cuido</text>
<rect x="30" y="205" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="219.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Atiende su oficina a la persona cuidadora como sujeto propio?</text>
<rect x="30" y="276" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="290.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="315.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Administra con reglas claras la lista de espera de su red de cuido?</text>
<rect x="30" y="347" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="376.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="386.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Cumple su centro diurno los estándares de accesibilidad, nutrición y</text>
<text x="112.0" y="415.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">calidad?</text>
<rect x="30" y="447" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="476.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="486.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Dirige sus recursos a las modalidades que mantienen a la persona en su</text>
<text x="112.0" y="515.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">comunidad?</text>
<rect x="30" y="547" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="561.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="586.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Reconoce a la persona cuidadora en su política y como patrono?</text>
<rect x="30" y="618" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="647.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="657.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Informa en formatos accesibles y retira un apoyo solo por acto motivado y</text>
<text x="112.0" y="686.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">recurrible?</text>
<text x="40.0" y="748.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>