<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="807" viewBox="0 0 1200 807" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2A8C6E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE I. VIDA</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 8</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Personas en situación de calle</text>
<rect x="30" y="205" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="219.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Sabe cuántas personas duermen en la calle en el cantón y dónde?</text>
<rect x="30" y="276" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="305.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="315.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Usa sus ayudas temporales para que una persona o familia en desgracia no</text>
<text x="112.0" y="344.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">pierda la casa?</text>
<rect x="30" y="376" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="405.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="415.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Tiene el reglamento del artículo 71, con criterios de ingreso objetivos y</text>
<text x="112.0" y="444.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">sin exigir vecindad?</text>
<rect x="30" y="476" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="505.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="515.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Presta el servicio, directamente o con inmuebles, subvenciones y</text>
<text x="112.0" y="544.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">coordinación?</text>
<rect x="30" y="576" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="605.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="615.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Si prohíbe pernoctar en un espacio público, ¿ofrece la referencia a un</text>
<text x="112.0" y="644.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">albergue o programa?</text>
<rect x="30" y="676" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="690.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="715.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Reserva en su cementerio un lugar para quien murió sin casa?</text>
<text x="40.0" y="777.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>