<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="733" viewBox="0 0 1200 733" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2A8C6E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE I. VIDA</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 6</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#B5543A">El caso, paso a paso</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Emergencias y desastres</text>
<line x1="250" y1="235" x2="250" y2="639.0" stroke="#C9CED6" stroke-width="5"/>
<text x="216.0" y="266.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">1992</text>
<circle cx="250" cy="259.0" r="17" fill="#6B7480" stroke="white" stroke-width="4"/>
<rect x="286" y="223" width="900" height="72" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="252.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Una avalancha de lodo baja por la quebrada Santa María, en Purisil</text>
<text x="306.0" y="281.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">de Orosi</text>
<text x="216.0" y="354.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Ago 2009</text>
<circle cx="250" cy="347.0" r="17" fill="#6B7480" stroke="white" stroke-width="4"/>
<rect x="286" y="311" width="900" height="72" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="340.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La CNE pide estudios y no otorgar permisos de construcción en</text>
<text x="306.0" y="369.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Purisil</text>
<text x="216.0" y="442.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2021</text>
<circle cx="250" cy="435.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="399" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="428.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Los vecinos piden trabajos preventivos; el alcalde alega que no</text>
<text x="306.0" y="457.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">hay declaratoria de emergencia</text>
<text x="216.0" y="518.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">9 ago 2022</text>
<circle cx="250" cy="511.0" r="17" fill="#6B7480" stroke="white" stroke-width="4"/>
<rect x="286" y="487" width="900" height="48" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="519.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El río Purisil se desborda y arrastra una sección del dique</text>
<text x="216.0" y="582.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Sentencia</text>
<circle cx="250" cy="575.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="551" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="583.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala ordena cumplir las recomendaciones en seis meses</text>
<text x="216.0" y="646.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2023</text>
<circle cx="250" cy="639.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="615" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="647.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Concejo y alcalde deben ejecutar juntos el informe de 2009</text>
<circle cx="52" cy="697" r="11" fill="#B5543A"/>
<text x="70.0" y="704.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Persona o comunidad</text>
<circle cx="291.5" cy="697" r="11" fill="#5B4B8A"/>
<text x="309.5" y="704.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Sala o tribunal</text>
<circle cx="489.0" cy="697" r="11" fill="#6B7480"/>
<text x="507.0" y="704.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Otra institución</text></svg>