<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="807" viewBox="0 0 1200 807" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2A8C6E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE I. VIDA</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 1</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Salud física</text>
<rect x="30" y="205" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="219.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Presta los servicios esenciales para la salud ambiental del cantón?</text>
<rect x="30" y="276" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="305.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="315.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Vigila las construcciones, lotes, locales y actividades que autoriza, y da</text>
<text x="112.0" y="344.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">seguimiento a sus clausuras?</text>
<rect x="30" y="376" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="405.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="415.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Actúa sobre la obra sin permiso que vierte aguas negras, aunque la orden</text>
<text x="112.0" y="444.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">sanitaria sea del Ministerio?</text>
<rect x="30" y="476" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="490.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="515.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Promueve el ejercicio físico por medio del comité cantonal de deportes?</text>
<rect x="30" y="547" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="576.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="586.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Destina a servicios de salud definidos con el Ministerio no menos del 20 %</text>
<text x="112.0" y="615.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">de sus entradas anuales, y lo demuestra con un convenio?</text>
<rect x="30" y="647" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="676.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="686.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Retiene la parte de la denuncia sanitaria que depende de un permiso, una</text>
<text x="112.0" y="715.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">obra o un servicio suyo?</text>
<text x="40.0" y="777.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>