<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2F86AE"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE IV. BIENESTAR Y ENTORNO</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 30</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Ambiente y arbolado</text>
<rect x="30" y="205" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="219.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Aprueba el plan regulador con criterio técnico previo?</text>
<rect x="30" y="276" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="290.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="315.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Usa la clausura y vuelve sobre ella?</text>
<rect x="30" y="347" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="361.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="386.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Tiene reglamento, plan, inventario y evaluación de riesgo de su arbolado?</text>
<rect x="30" y="418" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="447.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="457.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Cuando el asunto no es suyo, ¿informa por escrito la vía y previene mientras</text>
<text x="112.0" y="486.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">tanto?</text>
<text x="40.0" y="548.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>