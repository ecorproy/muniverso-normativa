<rect x="286" y="223" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="252.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Comisión de Niñez y Adolescencia del Concejo de Desamparados</text>
<text x="306.0" y="281.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">abre el proceso</text>
<text x="216.0" y="354.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Consulta</text>
<circle cx="250" cy="347.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="311" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="340.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Talleres con organizaciones, niñas, niños, adolescentes y personas</text>
<text x="306.0" y="369.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">adultas</text>
<text x="216.0" y="442.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Hallazgo</text>
<circle cx="250" cy="435.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="399" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="428.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Los adolescentes nombran la mala atención de la salud mental como</text>
<text x="306.0" y="457.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">su principal problema</text>
<text x="216.0" y="530.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Diagnóstico</text>
<circle cx="250" cy="523.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="487" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="516.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La política lo relaciona con la falta de zonas públicas para el</text>
<text x="306.0" y="545.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">ocio, más grave en lo rural</text>
<text x="216.0" y="618.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Ago 2023</text>
<circle cx="250" cy="611.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="575" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="604.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La política pide declarar emergencia cantonal la atención en salud</text>
<text x="306.0" y="633.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">mental</text>
