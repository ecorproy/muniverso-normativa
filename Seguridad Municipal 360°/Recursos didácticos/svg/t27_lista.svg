<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#C94158"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE III. PROTECCIÓN ESPECIAL</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 27</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Convivencia vecinal</text>
<rect x="30" y="205" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="219.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Otorga las licencias con condiciones y las vigila aunque no haya denuncia?</text>
<rect x="30" y="276" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="305.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="315.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Excluye de sus bienes públicos las actividades peligrosas mediante un acto</text>
<text x="112.0" y="344.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">publicado?</text>
<rect x="30" y="376" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="390.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="415.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Separa en el plan regulador, con estudios técnicos, los usos incompatibles?</text>
<rect x="30" y="447" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="476.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="486.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Analiza la ubicación de los festejos y vigila su cumplimiento aunque otro</text>
<text x="112.0" y="515.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">dé el permiso?</text>
<rect x="30" y="547" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="561.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="586.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Ofrece un servicio de mediación autorizado por el Ministerio de Justicia?</text>
<rect x="30" y="618" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="647.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="657.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Oye a los jóvenes y a los concejos de distrito sobre las quejas y el</text>
<text x="112.0" y="686.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">espacio público?</text>
<text x="40.0" y="748.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>