<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="693" viewBox="0 0 1200 693" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#8A4F9E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE II. DIGNIDAD</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 14</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#B5543A">El caso, paso a paso</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Información y transparencia</text>
<line x1="250" y1="235" x2="250" y2="587.0" stroke="#C9CED6" stroke-width="5"/>
<text x="216.0" y="266.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Oct 2022</text>
<circle cx="250" cy="259.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="223" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="252.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Un usuario bloqueado pide a San Ramón la lista de bloqueos de su</text>
<text x="306.0" y="281.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">perfil de Facebook</text>
<text x="216.0" y="354.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">1 nov 2022</text>
<circle cx="250" cy="347.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="311" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="340.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La oficina responde: «Acuse de recibo. Favor referirse a la</text>
<text x="306.0" y="369.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">alcaldía»</text>
<text x="216.0" y="430.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">14 nov 2022</text>
<circle cx="250" cy="423.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="399" width="900" height="48" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="431.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El usuario presenta un amparo</text>
<text x="216.0" y="506.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Después</text>
<circle cx="250" cy="499.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="463" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="492.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Municipalidad sostiene que el perfil de Facebook no es</text>
<text x="306.0" y="521.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">información pública</text>
<text x="216.0" y="594.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2024</text>
<circle cx="250" cy="587.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="551" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="580.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Desamparados obliga a llevar bitácora de lo que se elimina en sus</text>
<text x="306.0" y="609.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">redes</text>
<circle cx="52" cy="657" r="11" fill="#B5543A"/>
<text x="70.0" y="664.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Persona o comunidad</text>
<circle cx="291.5" cy="657" r="11" fill="#1F4E79"/>
<text x="309.5" y="664.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Municipalidad</text></svg>