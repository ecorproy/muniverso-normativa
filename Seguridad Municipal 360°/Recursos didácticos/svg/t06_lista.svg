<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="936" viewBox="0 0 1200 936" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2A8C6E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE I. VIDA</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 6</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Emergencias y desastres</text>
<rect x="30" y="205" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="234.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Reúne la información sobre los riesgos del cantón y la convierte en</text>
<text x="112.0" y="273.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">decisiones?</text>
<rect x="30" y="305" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="334.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="344.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Niega la segregación y el permiso en zonas de inundación y clausura la obra</text>
<text x="112.0" y="373.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">sin permiso?</text>
<rect x="30" y="405" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="434.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="444.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Limpia cauces, repara el pluvial y rehabilita caminos sin esperar una</text>
<text x="112.0" y="473.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">declaratoria de emergencia?</text>
<rect x="30" y="505" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="534.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="544.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Coordina con la CNE y las instituciones hasta lograr una solución, y no</text>
<text x="112.0" y="573.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">solo un oficio?</text>
<rect x="30" y="605" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="634.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="644.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Contesta la denuncia del vecino y asumen el Concejo y el alcalde juntos la</text>
<text x="112.0" y="673.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">solución de fondo?</text>
<rect x="30" y="705" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="734.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="744.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Otorga ayudas temporales cuyos requisitos no excluyan a quien la ley de</text>
<text x="112.0" y="773.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">emergencias protege?</text>
<rect x="30" y="805" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="819.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="844.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Presupuesta la prevención y ejecuta el fondo del 3 % con visión plurianual?</text>
<text x="40.0" y="906.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>