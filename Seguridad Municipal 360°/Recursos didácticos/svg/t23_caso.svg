<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="669" viewBox="0 0 1200 669" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#C94158"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE III. PROTECCIÓN ESPECIAL</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 23</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#B5543A">El caso, paso a paso</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Personas adultas mayores</text>
<line x1="250" y1="235" x2="250" y2="563.0" stroke="#C9CED6" stroke-width="5"/>
<text x="216.0" y="266.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2022</text>
<circle cx="250" cy="259.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="223" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="252.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Se denuncia el ascensor dañado del edificio municipal de Naranjo</text>
<text x="216.0" y="342.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">31 dic 2023</text>
<circle cx="250" cy="335.0" r="17" fill="#6B7480" stroke="white" stroke-width="4"/>
<rect x="286" y="311" width="900" height="48" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="343.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Vence sin cumplirse la segunda orden sanitaria</text>
<text x="216.0" y="418.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2024</text>
<circle cx="250" cy="411.0" r="17" fill="#B5543A" stroke="white" stroke-width="4"/>
<rect x="286" y="375" width="900" height="72" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="404.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Una mujer de setenta y un años pide la fila preferencial: no hay,</text>
<text x="306.0" y="433.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">por falta de personal</text>
<text x="216.0" y="494.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">15 may 2024</text>
<circle cx="250" cy="487.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="463" width="900" height="48" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="495.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El alcalde ordena habilitar una caja de atención mixta</text>
<text x="216.0" y="570.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Sentencia</text>
<circle cx="250" cy="563.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="527" width="900" height="72" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="556.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala ordena una ventanilla preferencial inmediata y seguir la</text>
<text x="306.0" y="585.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">orden sanitaria</text>
<circle cx="52" cy="633" r="11" fill="#B5543A"/>
<text x="70.0" y="640.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Persona o comunidad</text>
<circle cx="291.5" cy="633" r="11" fill="#1F4E79"/>
<text x="309.5" y="640.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Municipalidad</text>
<circle cx="468.0" cy="633" r="11" fill="#5B4B8A"/>
<text x="486.0" y="640.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Sala o tribunal</text>
<circle cx="665.5" cy="633" r="11" fill="#6B7480"/>
<text x="683.5" y="640.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Otra institución</text></svg>