<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40.0" y="56.0" font-size="22" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F4E79">Lo esencial</text>
<text x="40.0" y="100.0" font-size="32" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">La regla que deja el artículo 169</text>
<circle cx="600" cy="540" r="118" fill="#F8E2D8" stroke="#B5543A" stroke-width="5"/>
<text x="600.0" y="532.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B5543A">Lo local</text>
<text x="600.0" y="568.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="middle" fill="#44505F">en el artículo</text>
<text x="600.0" y="593.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="middle" fill="#44505F">169</text>
<line x1="600" y1="422" x2="600" y2="240" stroke="#1F4E79" stroke-width="3"/>
<rect x="435.0" y="185.05" width="330" height="109.9" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="600.0" y="216.8" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Reserva</text>
<text x="600.0" y="255.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">constitucional de materia a</text>
<text x="600.0" y="278.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">favor del Gobierno Municipal</text>
<line x1="712" y1="504" x2="885" y2="447" stroke="#B07A12" stroke-width="3"/>
<rect x="720.316954888546" y="380.4699016875158" width="330" height="133.65" rx="14" fill="#FBEDCF" stroke="#B07A12" stroke-width="3"/>
<text x="885.3" y="412.2" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B07A12">Sin lista</text>
<text x="885.3" y="450.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">es genérica: la precisan la</text>
<text x="885.3" y="474.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">ley y, a falta de ella, el</text>
<text x="885.3" y="498.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">examen de cada caso</text>
<line x1="669" y1="635" x2="776" y2="783" stroke="#4F7942" stroke-width="3"/>
<rect x="611.335575687742" y="715.8800983124842" width="330" height="133.65" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="776.3" y="747.6" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#4F7942">Convive</text>
<text x="776.3" y="785.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">con las competencias</text>
<text x="776.3" y="809.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">nacionales en el mismo</text>
<text x="776.3" y="833.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">territorio, por coordinación</text>
<line x1="531" y1="635" x2="424" y2="783" stroke="#9E2A2B" stroke-width="3"/>
<rect x="258.6644243122581" y="715.8800983124842" width="330" height="133.65" rx="14" fill="#F5DCDC" stroke="#9E2A2B" stroke-width="3"/>
<text x="423.7" y="747.6" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">No se vacía</text>
<text x="423.7" y="785.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">ni puede dejar a los</text>
<text x="423.7" y="809.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">habitantes de un cantón en</text>
<text x="423.7" y="833.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">inferioridad</text>
<line x1="488" y1="504" x2="315" y2="447" stroke="#6B7480" stroke-width="3"/>
<rect x="149.6830451114539" y="368.5949016875158" width="330" height="157.4" rx="14" fill="#EEF0F3" stroke="#6B7480" stroke-width="3"/>
<text x="314.7" y="400.3" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7480">Capacidad</text>
<text x="314.7" y="438.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">real y técnica; su falta no</text>
<text x="314.7" y="462.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">extingue el deber, y es el</text>
<text x="314.7" y="486.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">criterio para trasladarla</text>
<text x="314.7" y="509.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">por ley</text></svg>