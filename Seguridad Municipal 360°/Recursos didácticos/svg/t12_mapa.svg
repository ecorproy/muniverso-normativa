<circle cx="62" cy="809.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="816.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">9</text>
<text x="100.0" y="817.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La participación y la convivencia</text>
