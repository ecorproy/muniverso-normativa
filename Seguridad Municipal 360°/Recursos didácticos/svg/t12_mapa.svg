<text x="100.0" y="1005.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Cómo hace el gobierno local que la persona migrante</text>
<text x="100.0" y="1034.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">y refugiada pertenezca al cantón</text>
