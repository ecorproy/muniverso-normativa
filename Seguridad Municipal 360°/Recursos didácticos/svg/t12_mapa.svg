<circle cx="62" cy="480.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="487.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2</text>
<text x="100.0" y="488.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Quién forma parte del municipio</text>
<line x1="62" y1="527.5" x2="62" y2="574.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="527.5" r="19" fill="#1F4E79"/>
