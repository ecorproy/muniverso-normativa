<text x="62.0" y="863.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">10</text>
<text x="100.0" y="864.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La frontera</text>
