<text x="420.0" y="284.4" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1E2A38">¿Cómo hace el gobierno local que la persona migrante</text>
<text x="420.0" y="315.7" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1E2A38">y refugiada pertenezca al cantón?</text>
