<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1114" viewBox="0 0 1200 1114" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="230" fill="#8A4F9E"/>
<circle cx="140" cy="115" r="70" fill="white"/>
<g stroke="#8A4F9E" stroke-width="5.6000000000000005" fill="none" stroke-linecap="round"><line x1="140" y1="76.5" x2="140" y2="150.0"/><line x1="101.5" y1="90.5" x2="178.5" y2="90.5"/><line x1="119.0" y1="150.0" x2="161.0" y2="150.0"/></g>
<path d="M82.25,118.5 Q101.5,139.5 120.75,118.5 Z" fill="#8A4F9E"/><line x1="101.5" y1="90.5" x2="85.75" y2="118.5" stroke="#8A4F9E" stroke-width="3.5"/><line x1="101.5" y1="90.5" x2="117.25" y2="118.5" stroke="#8A4F9E" stroke-width="3.5"/>
<path d="M159.25,118.5 Q178.5,139.5 197.75,118.5 Z" fill="#8A4F9E"/><line x1="178.5" y1="90.5" x2="162.75" y2="118.5" stroke="#8A4F9E" stroke-width="3.5"/><line x1="178.5" y1="90.5" x2="194.25" y2="118.5" stroke="#8A4F9E" stroke-width="3.5"/>
<text x="250.0" y="95.0" font-size="26" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE II</text>
<text x="250.0" y="150.0" font-size="46" font-weight="bold" font-style="normal" text-anchor="start" fill="white">Dignidad</text>
<text x="250.0" y="192.0" font-size="22" font-weight="normal" font-style="italic" text-anchor="start" fill="white">CP, art. 33 · nueve temas</text>
<text x="40.0" y="270.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#8A4F9E">Las preguntas de este cuadrante</text>
<rect x="30" y="294" width="1140" height="79" rx="10" fill="white"/>
<circle cx="82" cy="333.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="343.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">10</text>
<text x="140.0" y="328.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Igualdad y no discriminación</text>
<text x="140.0" y="358.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que exista la igualdad?</text>
<rect x="30" y="379" width="1140" height="79" rx="10" fill="#EFE3F4"/>
<circle cx="82" cy="418.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="428.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">11</text>
<text x="140.0" y="413.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Igualdad de género</text>
<text x="140.0" y="443.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que exista la igualdad de género?</text>
<rect x="30" y="464" width="1140" height="104" rx="10" fill="white"/>
<circle cx="82" cy="516.0" r="30" fill="#8A4F9E"/>
<text x="82.0" y="526.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">12</text>
<text x="140.0" y="498.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Personas migrantes y refugiadas</text>
<text x="140.0" y="528.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que la persona migrante y refugiada pertenezca al</text>
<text x="140.0" y="553.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">cantón?</text>
<rect x="30" y="574" width="1140" height="79" rx="10" fill="#EFE3F4"/>
<circle cx="82" cy="613.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="623.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">13</text>
<text x="140.0" y="608.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Trato y trámites ante la Municipalidad</text>
<text x="140.0" y="638.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que la persona sea bien atendida?</text>
<rect x="30" y="659" width="1140" height="79" rx="10" fill="white"/>
<circle cx="82" cy="698.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="708.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">14</text>
<text x="140.0" y="693.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Información y transparencia</text>
<text x="140.0" y="723.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que la información sea de los vecinos?</text>
<rect x="30" y="744" width="1140" height="79" rx="10" fill="#EFE3F4"/>
<circle cx="82" cy="783.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="793.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">15</text>
<text x="140.0" y="778.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Participación</text>
<text x="140.0" y="808.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que las personas tomen parte?</text>
<rect x="30" y="829" width="1140" height="79" rx="10" fill="white"/>
<circle cx="82" cy="868.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="878.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">16</text>
<text x="140.0" y="863.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Intimidad y datos personales</text>
<text x="140.0" y="893.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que la intimidad exista?</text>
<rect x="30" y="914" width="1140" height="79" rx="10" fill="#EFE3F4"/>
<circle cx="82" cy="953.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="963.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">17</text>
<text x="140.0" y="948.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Acceso digital</text>
<text x="140.0" y="978.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que el acceso digital exista?</text>
<rect x="30" y="999" width="1140" height="79" rx="10" fill="white"/>
<circle cx="82" cy="1038.5" r="30" fill="#8A4F9E"/>
<text x="82.0" y="1048.5" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">18</text>
<text x="140.0" y="1033.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Trabajo y sustento</text>
<text x="140.0" y="1063.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">¿Cómo hace el gobierno local que el trabajo y el sustento existan?</text></svg>