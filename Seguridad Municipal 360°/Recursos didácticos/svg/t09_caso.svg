<rect x="286" y="399" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="428.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El alcalde consulta si puede rechazar las cesiones que su</text>
<text x="306.0" y="457.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">reglamento permite</text>
<text x="216.0" y="530.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Jul 2018</text>
<circle cx="250" cy="523.0" r="17" fill="#1F7A7A" stroke="white" stroke-width="4"/>
<rect x="286" y="487" width="900" height="72" rx="10" fill="white" stroke="#1F7A7A" stroke-width="2"/>
<text x="306.0" y="516.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Procuraduría: el cementerio es dominio público; los traspasos</text>
