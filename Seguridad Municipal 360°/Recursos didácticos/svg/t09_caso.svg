<rect x="286" y="311" width="900" height="72" rx="10" fill="white" stroke="#1F7A7A" stroke-width="2"/>
<text x="306.0" y="340.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Procuraduría: el permiso de uso no se cede ni se transmite por</text>
<text x="306.0" y="369.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">muerte</text>
<text x="216.0" y="442.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">May 2017</text>
