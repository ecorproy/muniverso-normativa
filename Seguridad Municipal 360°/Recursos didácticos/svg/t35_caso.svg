<rect x="286" y="311" width="900" height="48" rx="10" fill="white" stroke="#B5543A" stroke-width="2"/>
<text x="306.0" y="343.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Pide arreglar el parque y la cancha</text>
<text x="216.0" y="418.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Jun 2023</text>
<circle cx="250" cy="411.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="375" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="404.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Obras Públicas confirma el deterioro y queda «a la espera de la</text>
<text x="306.0" y="433.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">designación de prioridad»</text>
<text x="216.0" y="494.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Nov 2023</text>
