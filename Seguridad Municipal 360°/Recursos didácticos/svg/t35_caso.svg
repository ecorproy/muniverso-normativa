<text x="306.0" y="556.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Limpiezas y chapeas; el muro queda para un presupuesto</text>
<text x="306.0" y="585.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">extraordinario</text>
