<rect x="286" y="463" width="900" height="48" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="495.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El Área Rectora de Salud traslada el caso a la Municipalidad</text>
<text x="216.0" y="570.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2025</text>
