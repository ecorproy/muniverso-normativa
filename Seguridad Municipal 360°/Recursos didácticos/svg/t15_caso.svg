<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#8A4F9E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE II. DIGNIDAD</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 15</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#B5543A">El caso, paso a paso</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Participación</text>
<line x1="250" y1="235" x2="250" y2="579.0" stroke="#C9CED6" stroke-width="5"/>
<text x="216.0" y="254.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2017</text>
<circle cx="250" cy="247.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="223" width="900" height="48" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="255.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Convenio con el INVU para el plan regulador costero de Cahuita</text>
<text x="216.0" y="318.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">4 ago 2023</text>
<circle cx="250" cy="311.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="287" width="900" height="48" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="319.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Audiencia pública sin convocar a la comunidad de Keköldi</text>
<text x="216.0" y="382.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Dic 2023</text>
<circle cx="250" cy="375.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="351" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="383.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala anula la audiencia y ordena otra en tres meses</text>
<text x="216.0" y="446.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">8 mar 2024</text>
<circle cx="250" cy="439.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="415" width="900" height="48" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="447.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Segunda audiencia; después, ninguna actuación</text>
<text x="216.0" y="510.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Nov 2024</text>
<circle cx="250" cy="503.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="479" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="511.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala acoge la gestión de desobediencia</text>
<text x="216.0" y="586.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Sep 2025</text>
<circle cx="250" cy="579.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="543" width="900" height="72" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="572.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Queda pendiente la consulta al pueblo afrodescendiente; el plan,</text>
<text x="306.0" y="601.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">insubsistente</text>
<circle cx="52" cy="649" r="11" fill="#1F4E79"/>
<text x="70.0" y="656.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Municipalidad</text>
