<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40.0" y="56.0" font-size="22" font-weight="normal" font-style="italic" text-anchor="start" fill="#1F4E79">Lo esencial</text>
<text x="40.0" y="100.0" font-size="32" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Qué es lo local</text>
<circle cx="600" cy="570" r="118" fill="#F8E2D8" stroke="#B5543A" stroke-width="5"/>
<text x="600.0" y="562.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B5543A">Lo local</text>
<text x="600.0" y="598.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="middle" fill="#44505F">la persona del</text>
<text x="600.0" y="623.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="middle" fill="#44505F">cantón</text>
<line x1="600" y1="452" x2="600" y2="240" stroke="#B5543A" stroke-width="3"/>
<rect x="450.0" y="173.175" width="300" height="133.65" rx="14" fill="#F8E2D8" stroke="#B5543A" stroke-width="3"/>
<text x="600.0" y="204.9" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B5543A">Importa</text>
<text x="600.0" y="243.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">de manera directa e</text>
<text x="600.0" y="266.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">inmediata a las personas</text>
<text x="600.0" y="290.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">que viven en el cantón</text>
<line x1="692" y1="496" x2="921" y2="364" stroke="#B5543A" stroke-width="3"/>
<rect x="770.5509078118922" y="309.29836538661795" width="300" height="109.9" rx="14" fill="#F8E2D8" stroke="#B5543A" stroke-width="3"/>
<text x="920.6" y="341.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B5543A">Se conoce</text>
<text x="920.6" y="379.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">mirando la necesidad</text>
<text x="920.6" y="403.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">concreta de cada persona</text>
<line x1="715" y1="596" x2="1000" y2="643" stroke="#1F4E79" stroke-width="3"/>
<rect x="849.7204439945476" y="576.6069082055837" width="300" height="133.65" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="999.7" y="608.3" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Reservada</text>
<text x="999.7" y="646.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">al Gobierno Municipal:</text>
<text x="999.7" y="670.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">originaria, genérica y</text>
<text x="999.7" y="694.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">obligatoria</text>
<line x1="651" y1="676" x2="778" y2="867" stroke="#B5543A" stroke-width="3"/>
<rect x="627.8923330381989" y="800.4947264077982" width="300" height="133.65" rx="14" fill="#F8E2D8" stroke="#B5543A" stroke-width="3"/>
<text x="777.9" y="832.2" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B5543A">Se cumple</text>
<text x="777.9" y="870.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">cuando el servicio llega</text>
<text x="777.9" y="894.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">y la persona recibe lo</text>
<text x="777.9" y="918.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">que necesitaba</text>
<line x1="549" y1="676" x2="422" y2="867" stroke="#B07A12" stroke-width="3"/>
<rect x="272.1076669618012" y="788.6197264077982" width="300" height="157.4" rx="14" fill="#FBEDCF" stroke="#B07A12" stroke-width="3"/>
<text x="422.1" y="820.3" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B07A12">Se precisa</text>
<text x="422.1" y="858.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">por la ley o por el</text>
<text x="422.1" y="882.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">examen de cada caso: lo</text>
<text x="422.1" y="906.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">hace la municipalidad, lo</text>
<text x="422.1" y="929.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">revisa el juez</text>
<line x1="485" y1="596" x2="200" y2="643" stroke="#4F7942" stroke-width="3"/>
<rect x="50.279556005452264" y="564.7319082055836" width="300" height="157.4" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="200.3" y="596.4" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#4F7942">Se coordina</text>
<text x="200.3" y="634.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">con lo nacional: insta a</text>
<text x="200.3" y="658.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">la otra institución y</text>
<text x="200.3" y="682.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">lleva a la persona hasta</text>
<text x="200.3" y="706.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">ella</text>
<line x1="508" y1="496" x2="279" y2="364" stroke="#6B7480" stroke-width="3"/>
<rect x="129.44909218810773" y="297.423365386618" width="300" height="133.65" rx="14" fill="#EEF0F3" stroke="#6B7480" stroke-width="3"/>
<text x="279.4" y="329.1" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B7480">Requiere capacidad</text>
<text x="279.4" y="367.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">real y técnica; su falta</text>
<text x="279.4" y="391.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">no quita la titularidad</text>
<text x="279.4" y="414.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">ni el deber</text></svg>