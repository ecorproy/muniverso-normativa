<rect x="286" y="439" width="900" height="48" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="471.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Primera prueba de coloración, mes y medio después</text>
