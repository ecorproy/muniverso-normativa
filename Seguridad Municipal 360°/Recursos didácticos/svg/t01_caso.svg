<rect x="286" y="311" width="900" height="48" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="343.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El Concejo traslada la denuncia al alcalde</text>
<text x="216.0" y="406.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">5 feb 2007</text>
<circle cx="250" cy="399.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="375" width="900" height="48" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="407.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Inspección municipal; se coordina con el Ministerio de Salud</text>
<text x="216.0" y="470.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">15 mar 2007</text>
