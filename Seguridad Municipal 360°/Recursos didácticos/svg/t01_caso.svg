<text x="306.0" y="535.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Se notifica el amparo; llega la tercera prueba</text>
<text x="216.0" y="598.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Sentencia</text>
<circle cx="250" cy="591.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="567" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="599.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala condena a ambos: cada uno se quedó corto en lo suyo</text>
