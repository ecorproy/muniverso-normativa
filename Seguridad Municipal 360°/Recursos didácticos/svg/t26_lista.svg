<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#C94158"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE III. PROTECCIÓN ESPECIAL</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 26</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Violencia doméstica</text>
<rect x="30" y="205" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="234.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Integra la red local de atención y prevención, y lleva a ella lo que solo</text>
<text x="112.0" y="273.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">la municipalidad conoce?</text>
<rect x="30" y="305" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="334.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="344.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Atiende su oficina de la mujer en crisis, valora el riesgo, refiere y</text>
<text x="112.0" y="373.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">denuncia?</text>
<rect x="30" y="405" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="434.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="444.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Socorre la policía municipal a la víctima sin esperar requerimiento, con</text>
<text x="112.0" y="473.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">protocolo coordinado?</text>
<rect x="30" y="505" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="519.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="544.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Aporta un inmueble para una casa o un albergue?</text>
<rect x="30" y="576" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="605.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="615.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Mantiene el servicio también de noche y en fines de semana, con</text>
<text x="112.0" y="644.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">financiamiento estable?</text>
<rect x="30" y="676" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="705.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="715.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Atiende también la situación de los hijos y pide al juez las medidas que</text>
<text x="112.0" y="744.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">corresponden?</text>
<text x="40.0" y="806.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>