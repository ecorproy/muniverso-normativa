<rect x="286" y="311" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="340.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El camino ocupa la posición 57; su arreglo estaba previsto para</text>
<text x="306.0" y="369.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">2030</text>
