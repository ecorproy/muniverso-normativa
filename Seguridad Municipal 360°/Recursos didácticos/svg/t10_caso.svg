<rect x="286" y="399" width="900" height="72" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="428.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala ordena repararlo en 6 meses; la urgencia obliga a ajustar</text>
<text x="306.0" y="457.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">la programación</text>
<text x="216.0" y="518.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Jul 2026</text>
<circle cx="250" cy="511.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="487" width="900" height="48" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="519.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La Sala resuelve el camino 7-01-240, del mismo territorio</text>
