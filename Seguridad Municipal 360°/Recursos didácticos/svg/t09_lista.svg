<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2A8C6E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE I. VIDA</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 9</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Final de la vida</text>
<rect x="30" y="205" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="234.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Trata el cementerio como dominio público y rechaza los traspasos entre</text>
<text x="112.0" y="273.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">particulares?</text>
<rect x="30" y="305" width="1140" height="63" rx="10" fill="white"/>
<rect x="52" y="319.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="344.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Dice su reglamento quién sigue usando el lugar cuando muere el titular?</text>
<rect x="30" y="376" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="405.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="415.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Aparta espacio para la extrema pobreza y define quién califica la</text>
<text x="112.0" y="444.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">necesidad?</text>
<rect x="30" y="476" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="505.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="515.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Si una junta administra el cementerio, ¿la nombra, la reglamenta y le pide</text>
<text x="112.0" y="544.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">cuentas?</text>
<rect x="30" y="576" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="605.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="615.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Reserva en el plan regulador el suelo donde un cementerio puede funcionar</text>
<text x="112.0" y="644.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">sin dañar el agua?</text>
<rect x="30" y="676" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="705.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="715.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Mantiene el camino de los cuidados paliativos y ayuda a la familia ante la</text>
<text x="112.0" y="744.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">enfermedad terminal?</text>
<text x="40.0" y="806.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>