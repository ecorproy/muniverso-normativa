<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1025.0" viewBox="0 0 1200 1025.0" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#C94158"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE III. PROTECCIÓN ESPECIAL</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 27</text>
<text x="40.0" y="140.0" font-size="22" font-weight="normal" font-style="italic" text-anchor="start" fill="#C94158">Mapa del tema</text>
<text x="40.0" y="188.0" font-size="38" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Convivencia vecinal</text>
<rect x="40" y="241.5" width="760" height="102.5" rx="14" fill="#F9DFE4" stroke="#C94158" stroke-width="3"/>
<text x="420.0" y="284.4" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1E2A38">¿Cómo hace el gobierno local que exista la</text>
<text x="420.0" y="315.7" font-size="25" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1E2A38">convivencia vecinal?</text>
<text x="52.0" y="233.5" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#C94158">La pregunta del tema</text>
<text x="40.0" y="390.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">La ruta</text>
<line x1="62" y1="433.5" x2="62" y2="480.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="433.5" r="19" fill="#B5543A"/>
<text x="62.0" y="440.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">1</text>
<text x="100.0" y="441.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El caso</text>
<line x1="62" y1="480.5" x2="62" y2="527.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="480.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="487.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2</text>
<text x="100.0" y="488.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Lo que la municipalidad no puede prohibir</text>
<line x1="62" y1="542.0" x2="62" y2="618.0" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="542.0" r="19" fill="#1F4E79"/>
<text x="62.0" y="549.0" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">3</text>
<text x="100.0" y="535.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Lo que la municipalidad sí controla: sus bienes y su</text>
<text x="100.0" y="564.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">propia conducta</text>
<line x1="62" y1="603.5" x2="62" y2="650.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="603.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="610.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">4</text>
<text x="100.0" y="611.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La zonificación como lugar de la regla</text>
<line x1="62" y1="650.5" x2="62" y2="697.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="650.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="657.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">5</text>
<text x="100.0" y="658.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El ruido: la licencia no es patente de corso</text>
<line x1="62" y1="697.5" x2="62" y2="744.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="697.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="704.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">6</text>
<text x="100.0" y="705.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Fiestas, festejos y el espacio de todos</text>
<line x1="62" y1="744.5" x2="62" y2="791.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="744.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="751.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">7</text>
<text x="100.0" y="752.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El conflicto entre vecinos</text>
<line x1="62" y1="791.5" x2="62" y2="838.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="791.5" r="19" fill="#B07A12"/>
<text x="62.0" y="798.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">8</text>
<text x="100.0" y="799.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Con qué se paga</text>
<line x1="62" y1="853.0" x2="62" y2="929.0" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="853.0" r="19" fill="#4F7942"/>
<text x="62.0" y="860.0" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">9</text>
<text x="100.0" y="846.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Cómo hace el gobierno local que exista la</text>
<text x="100.0" y="875.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">convivencia vecinal</text>
<line x1="62" y1="914.5" x2="62" y2="961.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="914.5" r="19" fill="#6B7480"/>
<text x="62.0" y="921.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">10</text>
<text x="100.0" y="922.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Lo que hoy se mide</text>
<line x1="62" y1="961.5" x2="62" y2="961.5" stroke="#C9CED6" stroke-width="3"/>
<circle cx="62" cy="961.5" r="19" fill="#1F4E79"/>
<text x="62.0" y="968.5" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">11</text>
<text x="100.0" y="969.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">Conclusión</text>
<text x="850.0" y="150.0" font-size="19" font-weight="bold" font-style="normal" text-anchor="start" fill="#1E2A38">Colores de la ruta</text>
<circle cx="864" cy="184" r="11" fill="#B5543A"/>
<text x="886.0" y="191.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">El caso</text>
<circle cx="864" cy="220" r="11" fill="#1F4E79"/>
<text x="886.0" y="227.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Normas y casos</text>
<circle cx="864" cy="256" r="11" fill="#B07A12"/>
<text x="886.0" y="263.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Con qué se paga</text>
<circle cx="864" cy="292" r="11" fill="#4F7942"/>
<text x="886.0" y="299.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Cómo lo hace</text>
<circle cx="864" cy="328" r="11" fill="#6B7480"/>
<text x="886.0" y="335.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Lo que hoy se mide</text>
<circle cx="864" cy="364" r="11" fill="#1F4E79"/>
<text x="886.0" y="371.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Conclusión</text></svg>