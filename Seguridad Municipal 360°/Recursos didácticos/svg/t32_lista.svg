<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="636" viewBox="0 0 1200 636" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2F86AE"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE IV. BIENESTAR Y ENTORNO</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 32</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#4F7942">Revise en su municipalidad</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Vivienda</text>
<rect x="30" y="205" width="1140" height="63" rx="10" fill="#E2EEDC"/>
<rect x="52" y="219.5" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="244.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Visa los planos en quince días y sin cobrar?</text>
<rect x="30" y="276" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="305.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="315.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Recupera un bien público habitado comunicando la orden, dando plazo para</text>
<text x="112.0" y="344.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">defenderse y coordinando con quien valora a la familia?</text>
<rect x="30" y="376" width="1140" height="92" rx="10" fill="#E2EEDC"/>
<rect x="52" y="405.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="415.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Desarrolla vivienda en terrenos propios no demaniales, con una reserva para</text>
<text x="112.0" y="444.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">las familias de menores ingresos?</text>
<rect x="30" y="476" width="1140" height="92" rx="10" fill="white"/>
<rect x="52" y="505.0" width="34" height="34" rx="6" fill="white" stroke="#4F7942" stroke-width="3"/>
<text x="112.0" y="515.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">¿Propone beneficiarios de bonos, otorga ayudas ante la desgracia y abre</text>
<text x="112.0" y="544.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">albergues?</text>
<text x="40.0" y="606.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Una casilla vacía es una tarea, y a veces un riesgo de condena.</text></svg>