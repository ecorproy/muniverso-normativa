<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="669" viewBox="0 0 1200 669" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1200" height="78" fill="#2A8C6E"/>
<text x="40.0" y="50.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="start" fill="white">CUADRANTE I. VIDA</text>
<text x="1160.0" y="54.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="end" fill="white">TEMA 7</text>
<text x="40.0" y="135.0" font-size="30" font-weight="bold" font-style="normal" text-anchor="start" fill="#B5543A">El caso, paso a paso</text>
<text x="40.0" y="169.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#44505F">Adicciones</text>
<line x1="250" y1="235" x2="250" y2="563.0" stroke="#C9CED6" stroke-width="5"/>
<text x="216.0" y="266.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Oct 2006</text>
<circle cx="250" cy="259.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="223" width="900" height="72" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="252.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">En Alajuelita, un órgano director investiga los escándalos de dos</text>
<text x="306.0" y="281.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">bares</text>
<text x="216.0" y="354.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Ago 2007</text>
<circle cx="250" cy="347.0" r="17" fill="#6B7480" stroke="white" stroke-width="4"/>
<rect x="286" y="311" width="900" height="72" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="340.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">La policía informa balaceras; una bala entra en la casa de una</text>
<text x="306.0" y="369.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">vecina</text>
<text x="216.0" y="430.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">2007</text>
<circle cx="250" cy="423.0" r="17" fill="#6B7480" stroke="white" stroke-width="4"/>
<rect x="286" y="399" width="900" height="48" rx="10" fill="white" stroke="#6B7480" stroke-width="2"/>
<text x="306.0" y="431.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El 9-1-1 alerta un tiroteo: un herido y diez casquillos</text>
<text x="216.0" y="494.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Después</text>
<circle cx="250" cy="487.0" r="17" fill="#1F4E79" stroke="white" stroke-width="4"/>
<rect x="286" y="463" width="900" height="48" rx="10" fill="white" stroke="#1F4E79" stroke-width="2"/>
<text x="306.0" y="495.0" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El Concejo cierra el bar solo quince días</text>
<text x="216.0" y="570.0" font-size="20" font-weight="bold" font-style="normal" text-anchor="end" fill="#1E2A38">Apelación</text>
<circle cx="250" cy="563.0" r="17" fill="#5B4B8A" stroke="white" stroke-width="4"/>
<rect x="286" y="527" width="900" height="72" rx="10" fill="white" stroke="#5B4B8A" stroke-width="2"/>
<text x="306.0" y="556.5" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">El Tribunal anula la sanción por exigua: procedía el cierre</text>
<text x="306.0" y="585.2" font-size="23" font-weight="normal" font-style="normal" text-anchor="start" fill="#1E2A38">definitivo</text>
<circle cx="52" cy="633" r="11" fill="#1F4E79"/>
<text x="70.0" y="640.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Municipalidad</text>
<circle cx="228.5" cy="633" r="11" fill="#5B4B8A"/>
<text x="246.5" y="640.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Sala o tribunal</text>
<circle cx="426.0" cy="633" r="11" fill="#6B7480"/>
<text x="444.0" y="640.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">Otra institución</text></svg>