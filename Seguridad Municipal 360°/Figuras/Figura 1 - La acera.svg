<text x="220.0" y="170.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">de venta en la acera;</text>
<text x="220.0" y="198.4" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">permiso de uso precario.</text>
<text x="220.0" y="225.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Voto 1991-002306.</text>
<line x1="644.0" y1="422.7" x2="805.0" y2="140" stroke="#111" stroke-width="3"/>
