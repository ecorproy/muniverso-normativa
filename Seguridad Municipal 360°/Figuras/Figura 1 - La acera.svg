<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><ellipse cx="600" cy="500" rx="170" ry="80" fill="#e6e6e6" stroke="#111" stroke-width="4"/>
<text x="600.0" y="492.0" font-size="34" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La acera</text>
<text x="600.0" y="530.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">un metro y medio de concreto</text>
