<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><ellipse cx="600" cy="500" rx="170" ry="80" fill="#F8E2D8" stroke="#B5543A" stroke-width="5"/>
<text x="600.0" y="492.0" font-size="34" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B5543A">La acera</text>
<text x="600.0" y="530.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="middle" fill="#44505F">un metro y medio de concreto</text>
<line x1="556.0" y1="422.7" x2="395.0" y2="140" stroke="#8A4F9E" stroke-width="3"/>
<rect x="45.0" y="32.0" width="350" height="216.0" rx="14" fill="#EFE3F4" stroke="#8A4F9E" stroke-width="3"/>
<text x="220.0" y="71.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8A4F9E">Tema 18. Trabajo y</text>
<text x="220.0" y="101.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8A4F9E">sustento</text>
<text x="220.0" y="143.4" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">San José, 1991: puestos</text>
<text x="220.0" y="170.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">de venta en la acera;</text>
<text x="220.0" y="198.4" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">permiso de uso precario.</text>
<text x="220.0" y="225.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Voto 1991-002306.</text>
<line x1="644.0" y1="422.7" x2="805.0" y2="140" stroke="#C94158" stroke-width="3"/>
<rect x="805.0" y="33.25" width="350" height="213.5" rx="14" fill="#F9DFE4" stroke="#C94158" stroke-width="3"/>
<text x="980.0" y="72.5" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#C94158">Tema 24. Discapacidad</text>
<text x="980.0" y="114.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Heredia, 2012-2015: tres</text>
<text x="980.0" y="142.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">años de denuncias de un</text>
<text x="980.0" y="169.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">padre de dos hijos con</text>
<text x="980.0" y="197.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">discapacidad visual. Voto</text>
<text x="980.0" y="224.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">2015-012020.</text>
<line x1="430.0" y1="500.0" x2="395.0" y2="500" stroke="#2F86AE" stroke-width="3"/>
<rect x="45.0" y="407.0" width="350" height="186.0" rx="14" fill="#DCEEF7" stroke="#2F86AE" stroke-width="3"/>
<text x="220.0" y="446.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2F86AE">Tema 34. Cultura</text>
<text x="220.0" y="488.4" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Heredia, 2023: demolición</text>
<text x="220.0" y="516.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">de un pórtico centenario</text>
<text x="220.0" y="543.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">que estorbaba el paso.</text>
<text x="220.0" y="571.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Voto 2023-027541.</text>
<line x1="770.0" y1="500.0" x2="805.0" y2="500" stroke="#2F86AE" stroke-width="3"/>
<rect x="805.0" y="407.0" width="350" height="186.0" rx="14" fill="#DCEEF7" stroke="#2F86AE" stroke-width="3"/>
<text x="980.0" y="446.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2F86AE">Tema 30. Ambiente</text>
<text x="980.0" y="488.4" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">San Pablo de Heredia,</text>
<text x="980.0" y="516.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">2025: árboles de una ruta</text>
<text x="980.0" y="543.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">nacional levantaron la</text>
<text x="980.0" y="571.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">acera. Voto 2025-016121.</text>
<line x1="556.0" y1="577.3" x2="395.0" y2="860" stroke="#2F86AE" stroke-width="3"/>
<rect x="45.0" y="753.25" width="350" height="213.5" rx="14" fill="#DCEEF7" stroke="#2F86AE" stroke-width="3"/>
<text x="220.0" y="792.5" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2F86AE">Tema 33. Obra pública</text>
<text x="220.0" y="834.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Montes de Oca, 2025-2026:</text>
<text x="220.0" y="862.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">una finca sin acera; la</text>
<text x="220.0" y="889.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Municipalidad previno y</text>
<text x="220.0" y="917.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">no construyó. Voto</text>
<text x="220.0" y="944.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">2026-038693.</text>
<line x1="644.0" y1="577.3" x2="805.0" y2="860" stroke="#2A8C6E" stroke-width="3"/>
<rect x="805.0" y="752.0" width="350" height="216.0" rx="14" fill="#DDF1EA" stroke="#2A8C6E" stroke-width="3"/>
<text x="980.0" y="791.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A8C6E">Tema 6. Emergencias y</text>
<text x="980.0" y="821.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A8C6E">presupuesto</text>
<text x="980.0" y="863.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Los recursos de 2025 se</text>
<text x="980.0" y="891.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">reasignaron a la quebrada</text>
<text x="980.0" y="918.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Los Negritos. Voto</text>
<text x="980.0" y="946.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">2026-038693.</text></svg>