<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="60" width="440" height="270" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="260.0" y="156.9" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Poder Ejecutivo: Mideplán</text>
<text x="260.0" y="199.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Rectoría y lineamientos generales</text>
<text x="260.0" y="225.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">para homogeneizar los métodos de</text>
<text x="260.0" y="251.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">evaluación (Ley 10159, art. 28).</text>
<rect x="720" y="60" width="440" height="270" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="4"/>
<text x="940.0" y="143.8" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Municipalidad</text>
<text x="940.0" y="185.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Concejo y Alcaldía definen cómo se</text>
<text x="940.0" y="212.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">evalúa a su personal, «de forma</text>
<text x="940.0" y="238.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">exclusiva y excluyente»</text>
<text x="940.0" y="264.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(C-136-2026, ap. IV).</text>
<rect x="575" y="30" width="50" height="330" fill="#555" stroke="#111" stroke-width="2"/>
<text x="600.0" y="395.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Autonomía municipal</text>
<text x="600.0" y="425.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">«con las salvedades respectivas» (art. 28)</text>
<line x1="482" y1="195" x2="570" y2="195" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="526.0" y="180.0" font-size="18" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111"></text>
<text x="600.0" y="500.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La ley marco no puede vaciar de contenido la autonomía de las municipalidades</text>
<text x="600.0" y="530.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(Sala Constitucional, según C-136-2026, ap. IV).</text>
<text x="600.0" y="590.0" font-size="22" font-weight="normal" font-style="italic" text-anchor="middle" fill="#111">La responsabilidad de que la evaluación mida bien queda en el cantón.</text></svg>