<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="600.0" y="40.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Un proceso</text>
<rect x="40" y="70" width="600" height="100" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="340.0" y="97.0" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Responsable: el superior</text>
<text x="340.0" y="136.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">define procesos, proyectos, servicios y productos</text>
<text x="340.0" y="160.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(Ley 10159, art. 28)</text>
<circle cx="900" cy="125" r="95" fill="white" stroke="#111" stroke-width="3"/>
<text x="900.0" y="92.0" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Ciclo de</text>
<text x="900.0" y="116.0" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Deming</text>
<text x="900.0" y="146.0" font-size="16" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">planear, hacer,</text>
<text x="900.0" y="166.0" font-size="16" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">verificar,</text>
<text x="900.0" y="186.0" font-size="16" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">actuar</text>
<line x1="440" y1="170" x2="440" y2="226" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="40" y="230" width="240" height="130" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="160.0" y="301.0" font-size="24" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Entradas</text>
<line x1="282" y1="295" x2="316" y2="295" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="320" y="230" width="240" height="130" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="440.0" y="272.2" font-size="24" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Actividades</text>
<text x="440.0" y="312.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">secuencia ordenada</text>
<text x="440.0" y="336.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">y repetitiva</text>
<line x1="562" y1="295" x2="596" y2="295" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="600" y="230" width="240" height="130" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="720.0" y="260.4" font-size="24" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Servicio</text>
<text x="720.0" y="301.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">la prestación que</text>
<text x="720.0" y="324.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">ejecuta la</text>
<text x="720.0" y="348.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">dependencia</text>
<line x1="842" y1="295" x2="876" y2="295" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="880" y="230" width="280" height="130" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="4"/>
<text x="1020.0" y="272.2" font-size="24" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Producto</text>
<text x="1020.0" y="312.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">lo que recibe la</text>
<text x="1020.0" y="336.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">persona del cantón</text>
<path d="M 1020 360 L 1020 410 L 440 410 L 440 365" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)" stroke-dasharray="9,6"/>
<text x="1150.0" y="445.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="end" fill="#333">quien lo recibe juzga su validez (Medina León et al., 2009, p. 68)</text>
<rect x="40" y="480" width="520" height="85" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="300.0" y="509.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">El proceso necesita indicadores que muestren</text>
<text x="300.0" y="533.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">de forma gráfica su evolución (Medina León et</text>
<text x="300.0" y="557.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">al., 2009, p. 68)</text>
<line x1="40" y1="600" x2="1160" y2="600" stroke="#111" stroke-width="2"/>
<text x="600.0" y="650.0" font-size="28" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">El mapa de procesos de una municipalidad</text>
<rect x="40" y="690" width="240" height="160" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="160.0" y="776.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Estratégicos</text>
<rect x="290" y="690" width="700" height="160" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="640.0" y="753.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Concejo y Alcaldía: definen y controlan metas, políticas</text>
<text x="640.0" y="779.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">y estrategias (plan de desarrollo y plan anual</text>
<text x="640.0" y="806.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">operativo, CM, art. 13).</text>
<rect x="40" y="880" width="240" height="160" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="160.0" y="966.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Operativos</text>
<rect x="290" y="880" width="700" height="160" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="640.0" y="930.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Los servicios que presta cada dependencia y los</text>
<text x="640.0" y="956.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">productos que recibe la persona: la calle limpia, la</text>
<text x="640.0" y="983.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">acera construida, el permiso otorgado, la consulta</text>
<text x="640.0" y="1009.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">resuelta.</text>
<rect x="40" y="1070" width="240" height="160" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="160.0" y="1156.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">De apoyo</text>
<rect x="290" y="1070" width="700" height="160" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="640.0" y="1146.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La administración que los sostiene: presupuesto,</text>
<text x="640.0" y="1173.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">proveeduría, recursos humanos, sistemas.</text>
<rect x="1010" y="880" width="150" height="160" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="4"/>
<text x="1085.0" y="948.6" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Persona</text>
<text x="1085.0" y="986.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">del cantón</text>
<line x1="992" y1="960" x2="1006" y2="960" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<line x1="640" y1="850" x2="640" y2="876" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<line x1="640" y1="1070" x2="640" y2="1044" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="600.0" y="1290.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">Fuentes: Zaratiegui (1999, pp. 82-85); Medina León et al. (2009, pp. 67-70).</text></svg>