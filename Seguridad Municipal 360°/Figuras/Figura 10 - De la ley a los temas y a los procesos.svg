<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1786.4499999999996" viewBox="0 0 1200 1786.4499999999996" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="1160" height="50" fill="#111"/>
<text x="600.0" y="54.0" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">1. La ley obliga a planificar</text>
<rect x="20.0" y="92" width="373.3333333333333" height="264.2" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="206.7" y="124.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Cada superior</text>
<text x="206.7" y="164.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Define los procesos y</text>
<text x="206.7" y="189.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">proyectos de la dependencia y</text>
<text x="206.7" y="214.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">los productos y servicios</text>
<text x="206.7" y="239.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">prestados, de conformidad con</text>
<text x="206.7" y="264.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">la normativa vigente y los</text>
<text x="206.7" y="289.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">planes estratégicos</text>
<text x="206.7" y="314.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">institucionales (Ley 2166,</text>
<text x="206.7" y="339.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">art. 47; Ley 10159, art. 28).</text>
<rect x="413.3333333333333" y="92" width="373.3333333333333" height="264.2" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="600.0" y="123.5" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La jefatura, al inicio del</text>
<text x="600.0" y="151.2" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">año</text>
<text x="600.0" y="190.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Distribuye a cada persona</text>
<text x="600.0" y="215.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servidora entre esos procesos,</text>
<text x="600.0" y="240.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">proyectos, productos y</text>
<text x="600.0" y="265.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servicios, con plazos de</text>
<text x="600.0" y="290.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">entrega y tiempo estimado (Ley</text>
<text x="600.0" y="315.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">2166, art. 48; Ley 10159, art.</text>
<text x="600.0" y="340.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">29).</text>
<rect x="806.6666666666666" y="92" width="373.3333333333333" height="264.2" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="993.3" y="149.9" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Concejo y Alcaldía</text>
<text x="993.3" y="189.5" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Plan de desarrollo municipal y</text>
<text x="993.3" y="214.5" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">plan anual operativo con las</text>
<text x="993.3" y="239.5" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">necesidades e intereses de la</text>
<text x="993.3" y="264.5" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">población (CM, art. 13);</text>
<text x="993.3" y="289.5" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">manual de organización y</text>
<text x="993.3" y="314.5" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">funcionamiento (CM, art. 130).</text>
<line x1="600.0" y1="358.2" x2="600.0" y2="388.2" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="20" y="392.2" width="1160" height="50" fill="#111"/>
<text x="600.0" y="426.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2. Qué servicios: los treinta y seis temas</text>
<rect x="20.0" y="464.2" width="278.0" height="132.3" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="159.0" y="507.1" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">I. Vida</text>
<text x="159.0" y="545.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">CP, art. 21; temas 1 a</text>
<text x="159.0" y="569.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">9</text>
<rect x="314.0" y="464.2" width="278.0" height="132.3" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="453.0" y="507.1" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">II. Dignidad</text>
<text x="453.0" y="545.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">CP, art. 33; temas 10 a</text>
<text x="453.0" y="569.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">18</text>
<rect x="608.0" y="464.2" width="278.0" height="132.3" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="747.0" y="493.9" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">III. Protección</text>
<text x="747.0" y="520.3" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">especial</text>
<text x="747.0" y="558.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">CP, art. 51; temas 19 a</text>
<text x="747.0" y="582.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">27</text>
<rect x="902.0" y="464.2" width="278.0" height="132.3" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="1041.0" y="493.9" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">IV. Bienestar y</text>
<text x="1041.0" y="520.3" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">entorno</text>
<text x="1041.0" y="558.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">CP, art. 50; temas 28 a</text>
<text x="1041.0" y="582.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">36</text>
<rect x="20" y="608.5" width="1160" height="104.75" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="600.0" y="644.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Cada tema parte de un deber constitucional y se comprueba contra la normativa vigente en su</text>
<text x="600.0" y="670.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sección de normas: el mismo parámetro que la ley impone al superior. Es el inventario de ámbitos</text>
<text x="600.0" y="697.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">de servicio que la planificación necesita antes de asignar a nadie.</text>
<line x1="600.0" y1="715.25" x2="600.0" y2="745.25" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="20" y="749.25" width="1160" height="50" fill="#111"/>
<text x="600.0" y="783.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">3. Cómo: los pasos que fijan la ley y la gestión por procesos</text>
<circle cx="60" cy="861.55" r="26" fill="#111"/>
<text x="60.0" y="870.5" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">1</text>
<rect x="110" y="821.25" width="1070" height="80.6" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="645.0" y="849.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Identificar los procesos de cada tema</text>
<text x="645.0" y="889.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Responsable: cada superior (Ley 10159, art. 28).</text>
<line x1="645.0" y1="903.85" x2="645.0" y2="921.85" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="978.65" r="26" fill="#111"/>
<text x="60.0" y="987.6" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2</text>
<rect x="110" y="925.85" width="1070" height="105.6" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="645.0" y="954.4" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Clasificarlos y dibujar el mapa</text>
<text x="645.0" y="994.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Estratégicos, operativos y de apoyo, junto con el plan (Medina León et al., 2009, p. 70); el</text>
<text x="645.0" y="1019.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">mapa queda en el manual (CM, art. 130).</text>
<line x1="645.0" y1="1033.45" x2="645.0" y2="1051.45" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1095.75" r="26" fill="#111"/>
<text x="60.0" y="1104.8" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">3</text>
<rect x="110" y="1055.45" width="1070" height="80.6" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="645.0" y="1084.0" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Escribir la ficha de cada proceso</text>
<text x="645.0" y="1123.6" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Objetivo, entradas, salidas, responsable e indicadores (Zaratiegui, 1999, p. 85).</text>
<line x1="645.0" y1="1138.05" x2="645.0" y2="1156.05" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1200.35" r="26" fill="#111"/>
<text x="60.0" y="1209.3" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">4</text>
<rect x="110" y="1160.05" width="1070" height="80.6" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="645.0" y="1188.6" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Asignar personas y plazos</text>
<text x="645.0" y="1228.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Al inicio del año, con plazos de entrega y tiempo estimado (Ley 10159, art. 29).</text>
<line x1="645.0" y1="1242.6499999999999" x2="645.0" y2="1260.6499999999999" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1317.4499999999998" r="26" fill="#111"/>
<text x="60.0" y="1326.4" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">5</text>
<rect x="110" y="1264.6499999999999" width="1070" height="105.6" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="645.0" y="1293.2" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Medir y registrar</text>
<text x="645.0" y="1332.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Indicadores cuantitativos de metas de productos y servicios prestados (Ley 10159, art. 28);</text>
<text x="645.0" y="1357.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sistema informático al día (art. 29).</text>
<line x1="645.0" y1="1372.2499999999998" x2="645.0" y2="1390.2499999999998" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1434.5499999999997" r="26" fill="#111"/>
<text x="60.0" y="1443.5" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">6</text>
<rect x="110" y="1394.2499999999998" width="1070" height="80.6" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="645.0" y="1422.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Calificar</text>
<text x="645.0" y="1462.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">80 % metas y 20 % competencias (Ley 2166, art. 48), con la escala municipal (CM, art. 146).</text>
<line x1="645.0" y1="1476.8499999999997" x2="645.0" y2="1494.8499999999997" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1551.6499999999996" r="26" fill="#111"/>
<text x="60.0" y="1560.6" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">7</text>
<rect x="110" y="1498.8499999999997" width="1070" height="105.6" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="645.0" y="1527.4" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Rendir cuentas y mejorar</text>
<text x="645.0" y="1567.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Informe de labores ante el Concejo y los vecinos (CM, art. 17); ciclo de Deming (Medina León</text>
<text x="645.0" y="1592.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">et al., 2009, p. 68).</text>
<line x1="645.0" y1="1606.4499999999996" x2="645.0" y2="1630.4499999999996" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="385.0" y="1634.4499999999996" width="520" height="80" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="4"/>
<text x="645.0" y="1662.3" font-size="24" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La persona del cantón</text>
<text x="645.0" y="1703.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">¿A quién se le prestó?</text>
<path d="M 905.0 1674.4499999999996 L 1194 1674.4499999999996 L 1194 224.1 L 1182 224.1" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#ar)" stroke-dasharray="10,7"/>
<rect x="20" y="1736.4499999999996" width="40" height="26" rx="4" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="70.0" y="1756.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">lo ordena la ley</text>
<rect x="330" y="1736.4499999999996" width="40" height="26" rx="4" fill="white" stroke="#111" stroke-width="2" stroke-dasharray="6,4"/>
<text x="380.0" y="1756.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">lo aporta la gestión por procesos</text>
<text x="1180.0" y="1756.4" font-size="20" font-weight="normal" font-style="italic" text-anchor="end" fill="#333">las necesidades vuelven al plan ↺</text></svg>