<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1808.8499999999997" viewBox="0 0 1200 1808.8499999999997" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="1160" height="50" rx="8" fill="#1F4E79"/>
<text x="600.0" y="54.0" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">1. La ley obliga a planificar</text>
<rect x="20.0" y="92" width="373.3333333333333" height="286.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="206.7" y="123.5" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Cada superior</text>
<text x="206.7" y="163.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Define los procesos y</text>
<text x="206.7" y="188.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">proyectos de la dependencia y</text>
<text x="206.7" y="213.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">los servicios prestados y</text>
<text x="206.7" y="238.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">productos, de conformidad con</text>
<text x="206.7" y="263.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">la normativa vigente y los</text>
<text x="206.7" y="288.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">planes estratégicos</text>
<text x="206.7" y="313.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">gubernamentales</text>
<text x="206.7" y="338.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">institucionales (Ley 2166,</text>
<text x="206.7" y="363.1" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">art. 47; Ley 10159, art. 28).</text>
<rect x="413.3333333333333" y="92" width="373.3333333333333" height="286.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="600.0" y="134.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">La jefatura, al inicio del</text>
<text x="600.0" y="162.4" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">año</text>
<text x="600.0" y="202.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Distribuye a cada persona</text>
<text x="600.0" y="227.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">servidora entre esos procesos,</text>
<text x="600.0" y="252.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">proyectos, servicios y</text>
<text x="600.0" y="277.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">productos, con plazos de</text>
<text x="600.0" y="302.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">entrega y tiempo estimado (Ley</text>
<text x="600.0" y="327.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">2166, art. 48; Ley 10159, art.</text>
<text x="600.0" y="352.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">29).</text>
<rect x="806.6666666666666" y="92" width="373.3333333333333" height="286.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="993.3" y="161.1" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Concejo y Alcaldía</text>
<text x="993.3" y="200.7" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Plan de desarrollo municipal y</text>
<text x="993.3" y="225.7" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">plan anual operativo con las</text>
<text x="993.3" y="250.7" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">necesidades e intereses de la</text>
<text x="993.3" y="275.6" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">población (CM, art. 13);</text>
<text x="993.3" y="300.6" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">manual de organización y</text>
<text x="993.3" y="325.6" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">funcionamiento (CM, art. 130).</text>
<line x1="600.0" y1="380.6" x2="600.0" y2="410.6" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="20" y="414.6" width="1160" height="50" rx="8" fill="#1F4E79"/>
<text x="600.0" y="448.6" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2. Qué servicios: los treinta y seis temas</text>
<rect x="20.0" y="486.6" width="278.0" height="132.3" rx="14" fill="#DDF1EA" stroke="#2A8C6E" stroke-width="3"/>
<text x="159.0" y="529.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2A8C6E">I. Vida</text>
<text x="159.0" y="567.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">CP, art. 21; temas 1 a</text>
<text x="159.0" y="591.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">9</text>
<rect x="314.0" y="486.6" width="278.0" height="132.3" rx="14" fill="#EFE3F4" stroke="#8A4F9E" stroke-width="3"/>
<text x="453.0" y="529.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8A4F9E">II. Dignidad</text>
<text x="453.0" y="567.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">CP, art. 33; temas 10 a</text>
<text x="453.0" y="591.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">18</text>
<rect x="608.0" y="486.6" width="278.0" height="132.3" rx="14" fill="#F9DFE4" stroke="#C94158" stroke-width="3"/>
<text x="747.0" y="516.3" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#C94158">III. Protección</text>
<text x="747.0" y="542.7" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#C94158">especial</text>
<text x="747.0" y="581.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">CP, art. 51; temas 19 a</text>
<text x="747.0" y="604.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">27</text>
<rect x="902.0" y="486.6" width="278.0" height="132.3" rx="14" fill="#DCEEF7" stroke="#2F86AE" stroke-width="3"/>
<text x="1041.0" y="516.3" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2F86AE">IV. Bienestar y</text>
<text x="1041.0" y="542.7" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2F86AE">entorno</text>
<text x="1041.0" y="581.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">CP, art. 50; temas 28 a</text>
<text x="1041.0" y="604.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">36</text>
<rect x="20" y="630.9000000000001" width="1160" height="104.75" rx="14" fill="#EEF0F3" stroke="#6B7480" stroke-width="3" stroke-dasharray="9,6"/>
<text x="600.0" y="666.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Cada tema parte de un deber constitucional y se comprueba contra la normativa vigente en su</text>
<text x="600.0" y="693.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">sección de normas: el mismo parámetro que la ley impone al superior. Es el inventario de ámbitos</text>
<text x="600.0" y="719.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">de servicio que la planificación necesita antes de asignar a nadie.</text>
<line x1="600.0" y1="737.6500000000001" x2="600.0" y2="767.6500000000001" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="20" y="771.6500000000001" width="1160" height="50" rx="8" fill="#1F4E79"/>
<text x="600.0" y="805.7" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">3. Cómo: los pasos que fijan la ley y la gestión por procesos</text>
<circle cx="60" cy="883.95" r="26" fill="#1F4E79"/>
<text x="60.0" y="893.0" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">1</text>
<rect x="110" y="843.6500000000001" width="1070" height="80.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="645.0" y="872.2" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Identificar los procesos de cada tema</text>
<text x="645.0" y="911.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Responsable: cada superior (Ley 10159, art. 28).</text>
<line x1="645.0" y1="926.2500000000001" x2="645.0" y2="944.2500000000001" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1001.0500000000001" r="26" fill="#4F7942"/>
<text x="60.0" y="1010.1" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2</text>
<rect x="110" y="948.2500000000001" width="1070" height="105.6" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3" stroke-dasharray="9,6"/>
<text x="645.0" y="976.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#4F7942">Clasificarlos y dibujar el mapa</text>
<text x="645.0" y="1016.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Estratégicos, operativos y de apoyo, junto con el plan (Medina León et al., 2009, p. 70); el</text>
<text x="645.0" y="1041.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">mapa queda en el manual (CM, art. 130).</text>
<line x1="645.0" y1="1055.8500000000001" x2="645.0" y2="1073.8500000000001" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1118.15" r="26" fill="#4F7942"/>
<text x="60.0" y="1127.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">3</text>
<rect x="110" y="1077.8500000000001" width="1070" height="80.6" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3" stroke-dasharray="9,6"/>
<text x="645.0" y="1106.4" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#4F7942">Escribir la ficha de cada proceso</text>
<text x="645.0" y="1146.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Objetivo, entradas, salidas, responsable e indicadores (Zaratiegui, 1999, p. 85).</text>
<line x1="645.0" y1="1160.45" x2="645.0" y2="1178.45" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1222.75" r="26" fill="#1F4E79"/>
<text x="60.0" y="1231.8" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">4</text>
<rect x="110" y="1182.45" width="1070" height="80.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="645.0" y="1211.0" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Asignar personas y plazos</text>
<text x="645.0" y="1250.6" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Al inicio del año, con plazos de entrega y tiempo estimado (Ley 10159, art. 29).</text>
<line x1="645.0" y1="1265.05" x2="645.0" y2="1283.05" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1339.85" r="26" fill="#1F4E79"/>
<text x="60.0" y="1348.8" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">5</text>
<rect x="110" y="1287.05" width="1070" height="105.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="645.0" y="1315.6" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Medir y registrar</text>
<text x="645.0" y="1355.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Indicadores cuantitativos de metas individuales de servicios prestados y productos (Ley</text>
<text x="645.0" y="1380.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">10159, art. 28); sistema informático al día (art. 29).</text>
<line x1="645.0" y1="1394.6499999999999" x2="645.0" y2="1412.6499999999999" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1456.9499999999998" r="26" fill="#1F4E79"/>
<text x="60.0" y="1465.9" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">6</text>
<rect x="110" y="1416.6499999999999" width="1070" height="80.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="645.0" y="1445.2" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Calificar</text>
<text x="645.0" y="1484.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">80 % metas y 20 % competencias (Ley 2166, art. 48), con la escala municipal (CM, art. 146).</text>
<line x1="645.0" y1="1499.2499999999998" x2="645.0" y2="1517.2499999999998" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="60" cy="1574.0499999999997" r="26" fill="#1F4E79"/>
<text x="60.0" y="1583.0" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">7</text>
<rect x="110" y="1521.2499999999998" width="1070" height="105.6" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="645.0" y="1549.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">Rendir cuentas y mejorar</text>
<text x="645.0" y="1589.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Informe de labores ante el Concejo y los vecinos (CM, art. 17); ciclo de Deming (Medina León</text>
<text x="645.0" y="1614.4" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">et al., 2009, p. 68).</text>
<line x1="645.0" y1="1628.8499999999997" x2="645.0" y2="1652.8499999999997" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="385.0" y="1656.8499999999997" width="520" height="80" rx="14" fill="#F8E2D8" stroke="#B5543A" stroke-width="4"/>
<text x="645.0" y="1684.7" font-size="24" font-weight="bold" font-style="normal" text-anchor="middle" fill="#B5543A">La persona del cantón</text>
<text x="645.0" y="1725.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">¿Qué recibió y quién se lo prestó?</text>
<path d="M 905.0 1696.8499999999997 L 1194 1696.8499999999997 L 1194 235.3 L 1182 235.3" fill="none" stroke="#1E2A38" stroke-width="2.5" marker-end="url(#ar)" stroke-dasharray="10,7"/>
<rect x="20" y="1758.8499999999997" width="40" height="26" rx="4" fill="#DCE8F4" stroke="#1F4E79" stroke-width="2"/>
<text x="70.0" y="1778.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">lo ordena la ley</text>
<rect x="330" y="1758.8499999999997" width="40" height="26" rx="4" fill="#E2EEDC" stroke="#4F7942" stroke-width="2" stroke-dasharray="6,4"/>
<text x="380.0" y="1778.8" font-size="20" font-weight="normal" font-style="normal" text-anchor="start" fill="#44505F">lo aporta la gestión por procesos</text>
<text x="1180.0" y="1778.8" font-size="20" font-weight="normal" font-style="italic" text-anchor="end" fill="#44505F">las necesidades vuelven al plan ↺</text></svg>