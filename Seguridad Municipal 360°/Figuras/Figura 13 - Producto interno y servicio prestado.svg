<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="40" width="420" height="300" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="10,7"/>
<text x="250.0" y="150.5" font-size="27" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Producto interno</text>
<text x="250.0" y="195.1" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Un oficio archivado. Un informe</text>
<text x="250.0" y="222.6" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">que nadie usa. Un trámite que</text>
<text x="250.0" y="250.1" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">pasó de una oficina a otra.</text>
<rect x="740" y="40" width="420" height="300" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="4"/>
<text x="950.0" y="150.5" font-size="27" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Servicio prestado</text>
<text x="950.0" y="195.1" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La basura recogida. La acera</text>
<text x="950.0" y="222.6" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">construida. La solicitud</text>
<text x="950.0" y="250.1" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">resuelta en plazo.</text>
<line x1="465" y1="190" x2="734" y2="190" stroke="#111" stroke-width="4" marker-end="url(#ar)"/>
<text x="600.0" y="150.0" font-size="20" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">solo cuenta</text>
<text x="600.0" y="236.0" font-size="18" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">si el expediente</text>
<text x="600.0" y="258.0" font-size="18" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">termina en algo que</text>
<text x="600.0" y="280.0" font-size="18" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">una persona recibió</text>
<ellipse cx="600" cy="450" rx="300" ry="70" fill="#e6e6e6" stroke="#111" stroke-width="4"/>
<text x="600.0" y="462.0" font-size="32" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">¿A quién se le prestó?</text>
<text x="600.0" y="575.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Servir a cada administrado (LGAP, art. 114) y leer las normas por su fin (LGAP, art. 10).</text>
<text x="600.0" y="609.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Ninguna evaluación contra reglas unívocas de la ciencia o de la técnica (LGAP, art. 16).</text>
<text x="600.0" y="643.0" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Premiar el desempeño deficiente viola la idoneidad comprobada (voto 2025-008201).</text></svg>