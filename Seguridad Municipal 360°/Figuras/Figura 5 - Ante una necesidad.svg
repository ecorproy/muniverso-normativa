<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1590" viewBox="0 0 1200 1590" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="170" y="30" width="520" height="90" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="430.0" y="68.0" font-size="24" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Una necesidad de una persona del</text>
<text x="430.0" y="98.0" font-size="24" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">cantón</text>
<line x1="430" y1="120" x2="430" y2="170" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<polygon points="430,170.0 710.0,265 430,360.0 150.0,265" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
<text x="430.0" y="246.3" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">¿Importa de manera directa e</text>
<text x="430.0" y="272.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">inmediata a las personas del</text>
<text x="430.0" y="299.1" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">cantón?</text>
<rect x="815" y="180" width="360" height="170" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="995.0" y="222.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Corresponde a otra</text>
<text x="995.0" y="248.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">institución: la</text>
<text x="995.0" y="274.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">municipalidad la insta a</text>
<text x="995.0" y="301.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">atenderla y lleva a la</text>
<text x="995.0" y="327.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">persona hasta ella</text>
<line x1="710" y1="265" x2="813" y2="265" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="730.0" y="252.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">No</text>
<line x1="430" y1="360" x2="430" y2="410" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="442.0" y="395.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">Sí</text>
<polygon points="430,410.0 710.0,500 430,590.0 150.0,500" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
<text x="430.0" y="494.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">¿Una ley la organizó para</text>
<text x="430.0" y="520.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">todo el país?</text>
<rect x="815" y="440" width="360" height="120" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="995.0" y="483.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Zona de certeza negativa:</text>
<text x="995.0" y="509.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">coordinar, comunicar e</text>
<text x="995.0" y="536.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">instar</text>
<line x1="710" y1="500" x2="813" y2="500" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="730.0" y="487.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">Sí</text>
<line x1="430" y1="590" x2="430" y2="640" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="442.0" y="625.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">No</text>
<polygon points="430,640.0 710.0,735 430,830.0 150.0,735" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
<text x="430.0" y="729.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">¿Hay que restringir derechos</text>
<text x="430.0" y="755.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">o sancionar?</text>
<rect x="815" y="675" width="360" height="120" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="995.0" y="731.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Hace falta ley; no basta un</text>
<text x="995.0" y="758.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">reglamento (LGAP, art. 12)</text>
<line x1="710" y1="735" x2="813" y2="735" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="730.0" y="722.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">Sí</text>
<path d="M 995 790 L 995 850 L 460 850 L 460 880" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="1010.0" y="830.0" font-size="19" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">con ley habilitante</text>
<line x1="430" y1="830" x2="430" y2="880" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="370.0" y="865.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">No</text>
<polygon points="430,880.0 710.0,975 430,1070.0 150.0,975" fill="#f2f2f2" stroke="#111" stroke-width="3"/>
<text x="430.0" y="969.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">¿Tiene capacidad real y</text>
<text x="430.0" y="995.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">técnica?</text>
<rect x="815" y="895" width="360" height="170" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="995.0" y="950.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Coordinar y llevar a la</text>
<text x="995.0" y="976.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">persona a la institución</text>
<text x="995.0" y="1003.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">competente; la obligación</text>
<text x="995.0" y="1029.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">propia no se extingue</text>
<line x1="710" y1="975" x2="813" y2="975" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="730.0" y="962.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">No</text>
<line x1="430" y1="1070" x2="430" y2="1120" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<text x="442.0" y="1105.0" font-size="21" font-weight="normal" font-style="italic" text-anchor="start" fill="#333">Sí</text>
<rect x="130" y="1120" width="600" height="130" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="430.0" y="1160.2" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Prestar</text>
<text x="430.0" y="1203.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">de manera planificada, regular, eficiente,</text>
<text x="430.0" y="1229.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">continua y en condiciones de igualdad</text>
<line x1="430" y1="1250" x2="430" y2="1300" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="130" y="1300" width="600" height="110" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="430.0" y="1343.4" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Medir y rendir cuentas</text>
<text x="430.0" y="1386.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">¿qué recibió la persona y quién se lo prestó?</text>
<text x="40" y="1520" font-size="20" font-style="italic" fill="#333">En toda la ruta rige la misma regla: la municipalidad no puede contestar que el asunto no le toca</text>
<text x="40" y="1550" font-size="20" font-style="italic" fill="#333">porque ninguna ley lo menciona.</text></svg>