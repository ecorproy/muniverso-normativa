<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="967.5" viewBox="0 0 1200 967.5" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="220" y="30" width="330" height="80" rx="0" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="550" y="30" width="330" height="80" rx="0" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="880" y="30" width="310" height="80" rx="0" fill="#555" stroke="#111" stroke-width="2"/>
<text x="385.0" y="78.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Ley 2166 (capítulo de</text>
<text x="385.0" y="105.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2018)</text>
<text x="715.0" y="78.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Ley 10159</text>
<text x="1035.0" y="78.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Lo que agrega la Ley</text>
<text x="1035.0" y="105.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Marco</text>
<rect x="30" y="110" width="190" height="129.0" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="180.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Finalidad</text>
<rect x="220" y="110" width="330" height="129.0" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="149.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mecanismo para la mejora</text>
<text x="385.0" y="173.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">continua de la gestión</text>
<text x="385.0" y="197.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">pública y del desempeño de</text>
<text x="385.0" y="221.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">los funcionarios (art. 45).</text>
<rect x="550" y="110" width="330" height="129.0" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="161.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La misma finalidad, referida</text>
<text x="715.0" y="185.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">a las personas servidoras</text>
<text x="715.0" y="209.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">públicas (art. 27).</text>
<rect x="880" y="110" width="310" height="129.0" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="173.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">El instrumento «deberá ser</text>
<text x="1035.0" y="197.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">objetivo» (art. 27).</text>
<rect x="30" y="239.0" width="190" height="152.75" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="320.9" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Rectoría</text>
<rect x="220" y="239.0" width="330" height="152.75" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="278.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mideplán; evalúa el sistema</text>
<text x="385.0" y="302.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">de empleo público en</text>
<text x="385.0" y="326.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">eficiencia, eficacia,</text>
<text x="385.0" y="350.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">economía y calidad (art.</text>
<text x="385.0" y="373.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">46).</text>
<rect x="550" y="239.0" width="330" height="152.75" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="290.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mideplán dicta lineamientos</text>
<text x="715.0" y="314.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">generales para homogeneizar</text>
<text x="715.0" y="338.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">los métodos de evaluación</text>
<text x="715.0" y="362.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(art. 28).</text>
<rect x="880" y="239.0" width="310" height="152.75" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="278.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">«Con las salvedades</text>
<text x="1035.0" y="302.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">respectivas»: en las</text>
<text x="1035.0" y="326.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">municipalidades la</text>
<text x="1035.0" y="350.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">evaluación la define el</text>
<text x="1035.0" y="373.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">propio ente (C-136-2026).</text>
<rect x="30" y="391.75" width="190" height="176.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="485.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Método</text>
<rect x="220" y="391.75" width="330" height="176.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="431.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Indicadores cuantitativos de</text>
<text x="385.0" y="455.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">metas individuales de</text>
<text x="385.0" y="479.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">productos y servicios</text>
<text x="385.0" y="502.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">prestados, vinculados a</text>
<text x="385.0" y="526.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">procesos y proyectos (art.</text>
<text x="385.0" y="550.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">47).</text>
<rect x="550" y="391.75" width="330" height="176.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="455.4" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">El mismo método; cada</text>
<text x="715.0" y="479.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">superior define procesos,</text>
<text x="715.0" y="502.9" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">proyectos, productos y</text>
<text x="715.0" y="526.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servicios (art. 28).</text>
<rect x="880" y="391.75" width="310" height="176.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="443.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Se mide también al cuerpo</text>
<text x="1035.0" y="467.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">directivo en todos sus</text>
<text x="1035.0" y="491.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">niveles, por metas y</text>
<text x="1035.0" y="514.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">objetivos institucionales</text>
<text x="1035.0" y="538.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(art. 28).</text>
<rect x="30" y="568.25" width="190" height="152.75" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="650.1" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Obligaciones</text>
<rect x="220" y="568.25" width="330" height="152.75" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="608.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La jefatura asigna al inicio</text>
<text x="385.0" y="632.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">del año; sistema</text>
<text x="385.0" y="655.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">informático; falta grave por</text>
<text x="385.0" y="679.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">no dar seguimiento o no</text>
<text x="385.0" y="703.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">registrar (art. 48).</text>
<rect x="550" y="568.25" width="330" height="152.75" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="620.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Las mismas tres</text>
<text x="715.0" y="643.8" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">obligaciones: jefatura,</text>
<text x="715.0" y="667.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">administración y persona</text>
<text x="715.0" y="691.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servidora (art. 29).</text>
<rect x="880" y="568.25" width="310" height="152.75" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="608.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La falta grave se declara</text>
<text x="1035.0" y="632.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">previo procedimiento</text>
<text x="1035.0" y="655.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">administrativo; el sistema</text>
<text x="1035.0" y="679.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">se pone a disposición de</text>
<text x="1035.0" y="703.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">cada persona (art. 29).</text>
<rect x="30" y="721.0" width="190" height="176.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="814.8" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Consecuencias</text>
<rect x="220" y="721.0" width="330" height="176.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="761.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Anualidad con «muy bueno»:</text>
<text x="385.0" y="784.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">80 % metas y 20 %</text>
<text x="385.0" y="808.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">competencias (art. 48);</text>
<text x="385.0" y="832.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">ascensos, promociones,</text>
<text x="385.0" y="856.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">reconocimientos y</text>
<text x="385.0" y="879.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">capacitaciones (art. 49).</text>
<rect x="550" y="721.0" width="330" height="176.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="796.6" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Da al artículo 48 de la Ley</text>
<text x="715.0" y="820.3" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">2166 su redacción vigente</text>
<text x="715.0" y="844.1" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(art. 49).</text>
<rect x="880" y="721.0" width="310" height="176.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="784.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Dos evaluaciones</text>
<text x="1035.0" y="808.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">consecutivas inferiores al</text>
<text x="1035.0" y="832.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">70 %: causal de despido</text>
<text x="1035.0" y="856.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(art. 21).</text>
<text x="600.0" y="937.5" font-size="21" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">La Ley Marco no derogó el capítulo de la Ley 2166: las dos se leen juntas.</text></svg>