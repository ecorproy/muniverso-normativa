<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1153.5" viewBox="0 0 1200 1153.5" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="220" y="30" width="330" height="96" rx="0" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="550" y="30" width="330" height="96" rx="0" fill="#111" stroke="#111" stroke-width="2"/>
<rect x="880" y="30" width="310" height="96" rx="0" fill="#555" stroke="#111" stroke-width="2"/>
<text x="385.0" y="72.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Ley 2166 (capítulo de</text>
<text x="385.0" y="99.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">2018)</text>
<text x="715.0" y="72.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Ley 10159</text>
<text x="1035.0" y="72.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Lo que agrega la Ley</text>
<text x="1035.0" y="99.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Marco</text>
<rect x="30" y="126" width="190" height="165.25" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="214.1" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Finalidad</text>
<rect x="220" y="126" width="330" height="165.25" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="165.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mecanismo para la mejora</text>
<text x="385.0" y="192.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">continua de la gestión</text>
<text x="385.0" y="218.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">pública y del desempeño</text>
<text x="385.0" y="244.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">de los funcionarios (art.</text>
<text x="385.0" y="270.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">45).</text>
<rect x="550" y="126" width="330" height="165.25" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="179.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La misma finalidad,</text>
<text x="715.0" y="205.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">referida a las personas</text>
<text x="715.0" y="231.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servidoras públicas (art.</text>
<text x="715.0" y="257.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">27).</text>
<rect x="880" y="126" width="310" height="165.25" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="192.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">El instrumento «deberá</text>
<text x="1035.0" y="218.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">ser objetivo» (art.</text>
<text x="1035.0" y="244.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">27).</text>
<rect x="30" y="291.25" width="190" height="191.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="392.5" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Rectoría</text>
<rect x="220" y="291.25" width="330" height="191.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="344.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mideplán; evalúa el</text>
<text x="385.0" y="370.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sistema de empleo público</text>
<text x="385.0" y="396.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">en eficiencia, eficacia,</text>
<text x="385.0" y="423.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">economía y calidad (art.</text>
<text x="385.0" y="449.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">46).</text>
<rect x="550" y="291.25" width="330" height="191.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="344.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mideplán dicta</text>
<text x="715.0" y="370.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">lineamientos generales</text>
<text x="715.0" y="396.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">para homogeneizar los</text>
<text x="715.0" y="423.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">métodos de evaluación</text>
<text x="715.0" y="449.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(art. 28).</text>
<rect x="880" y="291.25" width="310" height="191.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="331.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">«Con las salvedades</text>
<text x="1035.0" y="357.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">respectivas»: en las</text>
<text x="1035.0" y="383.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">municipalidades la</text>
<text x="1035.0" y="409.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">evaluación la define el</text>
<text x="1035.0" y="436.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">propio ente</text>
<text x="1035.0" y="462.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(C-136-2026).</text>
<rect x="30" y="482.75" width="190" height="191.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="584.0" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Método</text>
<rect x="220" y="482.75" width="330" height="191.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="522.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Indicadores cuantitativos</text>
<text x="385.0" y="549.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">de metas individuales de</text>
<text x="385.0" y="575.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">productos y servicios</text>
<text x="385.0" y="601.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">prestados, vinculados a</text>
<text x="385.0" y="627.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">procesos y proyectos</text>
<text x="385.0" y="654.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(art. 47).</text>
<rect x="550" y="482.75" width="330" height="191.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="549.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">El mismo método; cada</text>
<text x="715.0" y="575.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">superior define procesos,</text>
<text x="715.0" y="601.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">proyectos, productos y</text>
<text x="715.0" y="627.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servicios (art. 28).</text>
<rect x="880" y="482.75" width="310" height="191.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="522.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Se mide también al</text>
<text x="1035.0" y="549.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">cuerpo directivo en</text>
<text x="1035.0" y="575.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">todos sus niveles, por</text>
<text x="1035.0" y="601.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">metas y objetivos</text>
<text x="1035.0" y="627.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">institucionales (art.</text>
<text x="1035.0" y="654.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">28).</text>
<rect x="30" y="674.25" width="190" height="217.75" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="788.6" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Obligaciones</text>
<rect x="220" y="674.25" width="330" height="217.75" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="740.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La jefatura asigna al</text>
<text x="385.0" y="766.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">inicio del año; sistema</text>
<text x="385.0" y="793.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">informático; falta grave</text>
<text x="385.0" y="819.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">por no dar seguimiento o</text>
<text x="385.0" y="845.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">no registrar (art. 48).</text>
<rect x="550" y="674.25" width="330" height="217.75" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="753.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Las mismas tres</text>
<text x="715.0" y="779.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">obligaciones: jefatura,</text>
<text x="715.0" y="806.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">administración y persona</text>
<text x="715.0" y="832.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servidora (art. 29).</text>
<rect x="880" y="674.25" width="310" height="217.75" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="714.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La falta grave se</text>
<text x="1035.0" y="740.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">declara previo</text>
<text x="1035.0" y="766.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">procedimiento</text>
<text x="1035.0" y="793.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">administrativo; el</text>
<text x="1035.0" y="819.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">sistema se pone a</text>
<text x="1035.0" y="845.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">disposición de cada</text>
<text x="1035.0" y="871.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">persona (art. 29).</text>
<rect x="30" y="892.0" width="190" height="191.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="125.0" y="993.2" font-size="22" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Consecuencias</text>
<rect x="220" y="892.0" width="330" height="191.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="385.0" y="932.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Anualidad con «muy</text>
<text x="385.0" y="958.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">bueno»: 80 % metas y 20 %</text>
<text x="385.0" y="984.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">competencias (art. 48);</text>
<text x="385.0" y="1010.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">ascensos, promociones,</text>
<text x="385.0" y="1037.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">reconocimientos y</text>
<text x="385.0" y="1063.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">capacitaciones (art. 49).</text>
<rect x="550" y="892.0" width="330" height="191.5" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="715.0" y="971.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Da al artículo 48 de la</text>
<text x="715.0" y="997.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Ley 2166 su redacción</text>
<text x="715.0" y="1023.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">vigente (art. 49).</text>
<rect x="880" y="892.0" width="310" height="191.5" rx="0" fill="#e6e6e6" stroke="#111" stroke-width="2"/>
<text x="1035.0" y="958.2" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Dos evaluaciones</text>
<text x="1035.0" y="984.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">consecutivas inferiores</text>
<text x="1035.0" y="1010.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">al 70 %: causal de</text>
<text x="1035.0" y="1037.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">despido (art. 21).</text>
<text x="600.0" y="1123.5" font-size="21" font-weight="normal" font-style="italic" text-anchor="middle" fill="#333">La Ley Marco no derogó el capítulo de la Ley 2166: las dos se leen juntas.</text></svg>