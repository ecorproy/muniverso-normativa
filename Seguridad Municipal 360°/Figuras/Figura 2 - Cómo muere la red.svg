<text x="600.0" y="1060.0" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#4F7942">La regeneración</text>
<text x="600.0" y="1102.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">&quot;Un fragmento de micelio puede regenerar una red entera&quot; (Sheldrake, 2020, capítulo 2). En</text>
<text x="600.0" y="1128.3" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Heredia el fragmento fue una persona (voto 2015-012020).</text></svg>