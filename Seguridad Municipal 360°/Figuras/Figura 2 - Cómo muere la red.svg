<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1E2A38"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="360.0" y="60.0" font-size="27" font-weight="bold" font-style="normal" text-anchor="middle" fill="#4F7942">En la red de hongos</text>
<text x="880.0" y="60.0" font-size="27" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1F4E79">En el cantón</text>
<line x1="40" y1="85" x2="1160" y2="85" stroke="#111" stroke-width="2"/>
<rect x="40" y="110" width="240" height="120" rx="14" fill="#F5DCDC" stroke="#9E2A2B" stroke-width="3"/>
<text x="160.0" y="175.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">La captura</text>
<rect x="295" y="110" width="365" height="120" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="477.5" y="166.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">plantas que toman carbono de</text>
<text x="477.5" y="192.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">la red sin dar nada</text>
<line x1="665" y1="170" x2="690" y2="170" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="700" y="110" width="460" height="120" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="930.0" y="166.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Vermissa: un punto que recibe sin</text>
<text x="930.0" y="192.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">dar</text>
<rect x="40" y="260" width="240" height="120" rx="14" fill="#F5DCDC" stroke="#9E2A2B" stroke-width="3"/>
<text x="160.0" y="325.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">El corte</text>
<rect x="295" y="260" width="365" height="120" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="477.5" y="316.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">un micelio herido no avisa a</text>
<text x="477.5" y="342.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">su vecino desconectado</text>
<line x1="665" y1="320" x2="690" y2="320" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="700" y="260" width="460" height="120" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="930.0" y="316.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">el camino a China Kichá: sin escuela</text>
<text x="930.0" y="342.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">y sin EBAIS (voto 2026-013450)</text>
<rect x="40" y="410" width="240" height="120" rx="14" fill="#F5DCDC" stroke="#9E2A2B" stroke-width="3"/>
<text x="160.0" y="475.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">El desgaste</text>
<rect x="295" y="410" width="365" height="120" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="477.5" y="466.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">las conexiones envejecen y</text>
<text x="477.5" y="492.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">deben rehacerse</text>
