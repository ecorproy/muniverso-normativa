<rect x="700" y="410" width="460" height="120" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="930.0" y="466.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Montes de Oca, 2003: la flotilla sin</text>
<text x="930.0" y="492.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">mantenimiento (voto 2003-005006)</text>
<rect x="40" y="560" width="240" height="120" rx="14" fill="#F5DCDC" stroke="#9E2A2B" stroke-width="3"/>
<text x="160.0" y="611.9" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">El</text>
<text x="160.0" y="639.5" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">envenenamiento</text>
<rect x="295" y="560" width="365" height="120" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="477.5" y="603.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">el nitrógeno y la labranza</text>
<text x="477.5" y="629.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">intensiva alteran las</text>
<text x="477.5" y="656.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">micorrizas</text>
<line x1="665" y1="620" x2="690" y2="620" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="700" y="560" width="460" height="120" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="930.0" y="603.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">la mala práctica repetida hasta</text>
<text x="930.0" y="629.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">volverse costumbre (San Ramón, voto</text>
<text x="930.0" y="656.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">2023-001782)</text>
<rect x="40" y="710" width="240" height="120" rx="14" fill="#F5DCDC" stroke="#9E2A2B" stroke-width="3"/>
<text x="160.0" y="775.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">La sustitución</text>
<rect x="295" y="710" width="365" height="120" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="477.5" y="766.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">el fertilizante le quita el</text>
<text x="477.5" y="793.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">trabajo al hongo</text>
<line x1="665" y1="770" x2="690" y2="770" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="700" y="710" width="460" height="120" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="930.0" y="766.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">la competencia que no se ejerce</text>
<text x="930.0" y="793.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">prepara su traslado</text>
<rect x="40" y="860" width="240" height="120" rx="14" fill="#F5DCDC" stroke="#9E2A2B" stroke-width="3"/>
<text x="160.0" y="925.8" font-size="23" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9E2A2B">El acaparamiento</text>
<rect x="295" y="860" width="365" height="120" rx="14" fill="#E2EEDC" stroke="#4F7942" stroke-width="3"/>
<text x="477.5" y="916.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">hongos que retienen el</text>
<text x="477.5" y="943.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">fósforo</text>
<line x1="665" y1="920" x2="690" y2="920" stroke="#1E2A38" stroke-width="3" marker-end="url(#ar)"/>
<rect x="700" y="860" width="460" height="120" rx="14" fill="#DCE8F4" stroke="#1F4E79" stroke-width="3"/>
<text x="930.0" y="916.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">Upala, 2020: sesiones del Concejo</text>
<text x="930.0" y="943.0" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44505F">sin transmitir (voto 2020-016680)</text>
