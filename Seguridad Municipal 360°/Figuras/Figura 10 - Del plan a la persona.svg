<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1863.3000000000002" viewBox="0 0 1200 1863.3000000000002" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="120" y="30" width="700" height="157.7" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="470.0" y="69.1" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Concejo Municipal</text>
<text x="470.0" y="112.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Aprueba el plan de desarrollo municipal y el plan</text>
<text x="470.0" y="140.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">anual operativo, incorporando las necesidades e</text>
<text x="470.0" y="167.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">intereses de la población (CM, art. 13).</text>
<line x1="470.0" y1="187.7" x2="470.0" y2="231.7" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="233.7" width="700" height="157.7" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="470.0" y="272.8" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Alcaldía</text>
<text x="470.0" y="316.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mantiene actualizado el manual de organización y</text>
<text x="470.0" y="343.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">funcionamiento, donde queda escrito el mapa de</text>
<text x="470.0" y="371.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">procesos (CM, art. 130).</text>
<line x1="470.0" y1="391.4" x2="470.0" y2="435.4" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="437.4" width="700" height="157.7" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="470.0" y="476.5" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Cada superior</text>
<text x="470.0" y="519.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Define los procesos y proyectos de la dependencia y</text>
<text x="470.0" y="547.4" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">los productos y servicios prestados (Ley 10159, art.</text>
<text x="470.0" y="574.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">28).</text>
<line x1="470.0" y1="595.0999999999999" x2="470.0" y2="639.0999999999999" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="641.0999999999999" width="700" height="157.7" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="470.0" y="680.2" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La jefatura, al inicio del año</text>
<text x="470.0" y="723.6" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Asigna a cada persona servidora entre procesos,</text>
<text x="470.0" y="751.1" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">proyectos, productos y servicios, con plazos de</text>
<text x="470.0" y="778.6" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">entrega y tiempo estimado (Ley 10159, art. 29).</text>
<rect x="870" y="626.1999999999999" width="300" height="187.5" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="1020.0" y="664.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Sin seguimiento del</text>
<text x="1020.0" y="690.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">plan anual: falta</text>
<text x="1020.0" y="716.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">grave, previo</text>
<text x="1020.0" y="742.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">procedimiento</text>
<text x="1020.0" y="769.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">administrativo (art.</text>
<text x="1020.0" y="795.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">29).</text>
<line x1="820" y1="719.9499999999999" x2="868" y2="719.9499999999999" stroke="#111" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="470.0" y1="798.8" x2="470.0" y2="842.8" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="844.8" width="700" height="157.7" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="470.0" y="883.9" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La persona servidora</text>
<text x="470.0" y="927.3" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mantiene al día su desempeño en el sistema informático</text>
<text x="470.0" y="954.8" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">que la administración pone a su disposición (Ley</text>
<text x="470.0" y="982.3" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">10159, art. 29).</text>
<rect x="870" y="856.15" width="300" height="135.0" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="1020.0" y="894.1" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Sin registro al día:</text>
<text x="1020.0" y="920.4" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">falta grave, también</text>
<text x="1020.0" y="946.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">para todo el nivel</text>
<text x="1020.0" y="972.9" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">directivo (art. 29).</text>
<line x1="820" y1="923.65" x2="868" y2="923.65" stroke="#111" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="470.0" y1="1002.5" x2="470.0" y2="1046.5" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="1048.5" width="700" height="185.2" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="470.0" y="1087.6" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La evaluación</text>
<text x="470.0" y="1131.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">80 % cumplimiento de metas de productos y servicios;</text>
<text x="470.0" y="1158.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">20 % competencias del puesto valoradas por la jefatura</text>
<text x="470.0" y="1186.0" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(Ley 2166, art. 48). Motivada y recurrible (voto</text>
<text x="470.0" y="1213.5" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">2025-008201).</text>
<line x1="470.0" y1="1233.7" x2="470.0" y2="1277.7" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="1279.7" width="700" height="212.7" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="470.0" y="1318.8" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Los efectos</text>
<text x="470.0" y="1362.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Anualidad con «muy bueno» o su equivalente (Ley 2166,</text>
<text x="470.0" y="1389.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">art. 48); ascensos, promociones, reconocimientos y</text>
<text x="470.0" y="1417.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">capacitaciones (art. 49); dos evaluaciones</text>
<text x="470.0" y="1444.7" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">consecutivas inferiores al 70 %: causal de despido</text>
<text x="470.0" y="1472.2" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(Ley 10159, art. 21).</text>
<line x1="470.0" y1="1492.4" x2="470.0" y2="1536.4" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="1538.4" width="700" height="130.2" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="470.0" y="1577.5" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La rendición de cuentas</text>
<text x="470.0" y="1620.9" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Informe de labores de la alcaldía ante el Concejo, a</text>
<text x="470.0" y="1648.4" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">disposición de los habitantes (CM, art. 17).</text>
<line x1="470.0" y1="1668.6000000000001" x2="470.0" y2="1712.6000000000001" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="1714.6000000000001" width="700" height="102.7" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="4"/>
<text x="470.0" y="1753.7" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La persona del cantón</text>
<text x="470.0" y="1797.1" font-size="22" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">¿A quién se le prestó?</text>
<path d="M 120 1765.95 L 60 1765.95 L 60 108.85 L 118 108.85" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)" stroke-dasharray="10,7"/>
<text transform="translate(45,937.4) rotate(-90)" font-size="21" font-style="italic" text-anchor="middle" fill="#333">sus necesidades vuelven al plan</text></svg>