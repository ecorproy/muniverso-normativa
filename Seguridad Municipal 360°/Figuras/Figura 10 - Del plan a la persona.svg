<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1710.0" viewBox="0 0 1200 1710.0" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="120" y="30" width="700" height="149.0" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="470.0" y="68.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Concejo Municipal</text>
<text x="470.0" y="110.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Aprueba el plan de desarrollo municipal y el plan anual</text>
<text x="470.0" y="135.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">operativo, incorporando las necesidades e intereses de la</text>
<text x="470.0" y="160.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">población (CM, art. 13).</text>
<line x1="470.0" y1="179.0" x2="470.0" y2="223.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="225.0" width="700" height="149.0" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="3"/>
<text x="470.0" y="263.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Alcaldía</text>
<text x="470.0" y="305.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mantiene actualizado el manual de organización y</text>
<text x="470.0" y="330.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">funcionamiento, donde queda escrito el mapa de procesos</text>
<text x="470.0" y="355.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(CM, art. 130).</text>
<line x1="470.0" y1="374.0" x2="470.0" y2="418.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="420.0" width="700" height="124.0" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="470.0" y="458.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Cada superior</text>
<text x="470.0" y="500.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Define los procesos y proyectos de la dependencia y los</text>
<text x="470.0" y="525.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">productos y servicios prestados (Ley 10159, art. 28).</text>
<line x1="470.0" y1="544.0" x2="470.0" y2="588.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="590.0" width="700" height="149.0" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="470.0" y="628.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La jefatura, al inicio del año</text>
<text x="470.0" y="670.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Asigna a cada persona servidora entre procesos, proyectos,</text>
<text x="470.0" y="695.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">productos y servicios, con plazos de entrega y tiempo</text>
<text x="470.0" y="720.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">estimado (Ley 10159, art. 29).</text>
<rect x="870" y="602.0" width="300" height="125.0" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="1020.0" y="640.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Sin seguimiento del plan</text>
<text x="1020.0" y="663.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">anual: falta grave,</text>
<text x="1020.0" y="687.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">previo procedimiento</text>
<text x="1020.0" y="711.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">administrativo (art. 29).</text>
<line x1="820" y1="664.5" x2="868" y2="664.5" stroke="#111" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="470.0" y1="739.0" x2="470.0" y2="783.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="785.0" width="700" height="149.0" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="470.0" y="823.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La persona servidora</text>
<text x="470.0" y="865.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Mantiene al día su desempeño en el sistema informático que</text>
<text x="470.0" y="890.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">la administración pone a su disposición (Ley 10159, art.</text>
<text x="470.0" y="915.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">29).</text>
<rect x="870" y="797.0" width="300" height="125.0" rx="14" fill="white" stroke="#111" stroke-width="3" stroke-dasharray="9,6"/>
<text x="1020.0" y="835.0" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Sin registro al día:</text>
<text x="1020.0" y="858.7" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">falta grave, también para</text>
<text x="1020.0" y="882.5" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">todo el nivel directivo</text>
<text x="1020.0" y="906.2" font-size="19" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">(art. 29).</text>
<line x1="820" y1="859.5" x2="868" y2="859.5" stroke="#111" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="470.0" y1="934.0" x2="470.0" y2="978.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="980.0" width="700" height="149.0" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="470.0" y="1018.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La evaluación</text>
<text x="470.0" y="1060.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">80 % cumplimiento de metas de productos y servicios; 20 %</text>
<text x="470.0" y="1085.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">competencias del puesto valoradas por la jefatura (Ley</text>
<text x="470.0" y="1110.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">2166, art. 48). Motivada y recurrible (voto 2025-008201).</text>
<line x1="470.0" y1="1129.0" x2="470.0" y2="1173.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="1175.0" width="700" height="174.0" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="470.0" y="1213.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Los efectos</text>
<text x="470.0" y="1255.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Anualidad con «muy bueno» o su equivalente (Ley 2166, art.</text>
<text x="470.0" y="1280.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">48); ascensos, promociones, reconocimientos y</text>
<text x="470.0" y="1305.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">capacitaciones (art. 49); dos evaluaciones consecutivas</text>
<text x="470.0" y="1330.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">inferiores al 70 %: causal de despido (Ley 10159, art. 21).</text>
<line x1="470.0" y1="1349.0" x2="470.0" y2="1393.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="1395.0" width="700" height="124.0" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="470.0" y="1433.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La rendición de cuentas</text>
<text x="470.0" y="1475.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Informe de labores de la alcaldía ante el Concejo, a</text>
<text x="470.0" y="1500.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">disposición de los habitantes (CM, art. 17).</text>
<line x1="470.0" y1="1519.0" x2="470.0" y2="1563.0" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<rect x="120" y="1565.0" width="700" height="99.0" rx="14" fill="#bdbdbd" stroke="#111" stroke-width="4"/>
<text x="470.0" y="1603.2" font-size="25" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">La persona del cantón</text>
<text x="470.0" y="1645.2" font-size="20" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">¿A quién se le prestó?</text>
<path d="M 120 1614.5 L 60 1614.5 L 60 104.5 L 118 104.5" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)" stroke-dasharray="10,7"/>
<text transform="translate(45,859.5) rotate(-90)" font-size="21" font-style="italic" text-anchor="middle" fill="#333">sus necesidades vuelven al plan</text></svg>