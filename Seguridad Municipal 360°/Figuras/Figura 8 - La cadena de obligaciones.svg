<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1205" viewBox="0 0 1200 1205" font-family="DejaVu Serif, serif"><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><ellipse cx="110" cy="120" rx="70" ry="85" fill="none" stroke="#111" stroke-width="9"/>
<text x="110.0" y="134.0" font-size="40" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">1</text>
<rect x="220" y="50" width="940" height="140" rx="14" fill="#e6e6e6" stroke="#111" stroke-width="3"/>
<text x="690.0" y="95.2" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Constitución</text>
<text x="690.0" y="138.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Gobierno responsable (CP, art. 9); los funcionarios cumplen los deberes que</text>
<text x="690.0" y="164.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">la ley les impone (CP, art. 11).</text>
<ellipse cx="110" cy="345" rx="70" ry="85" fill="none" stroke="#111" stroke-width="9"/>
<text x="110.0" y="359.0" font-size="40" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">2</text>
<rect x="220" y="275" width="940" height="140" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="690.0" y="320.2" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Jurisprudencia de la Sala</text>
<text x="690.0" y="363.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Derecho exigible al buen funcionamiento de los servicios públicos (voto</text>
<text x="690.0" y="389.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">2003-011382).</text>
<ellipse cx="110" cy="570" rx="70" ry="85" fill="none" stroke="#111" stroke-width="9"/>
<text x="110.0" y="584.0" font-size="40" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">3</text>
<rect x="220" y="500" width="940" height="140" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="690.0" y="558.4" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Ley General de la Administración Pública</text>
<text x="690.0" y="601.7" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Continuidad, eficiencia, adaptación e igualdad del servicio (LGAP, art. 4).</text>
<ellipse cx="110" cy="795" rx="70" ry="85" fill="none" stroke="#111" stroke-width="9"/>
<text x="110.0" y="809.0" font-size="40" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">4</text>
<rect x="220" y="725" width="940" height="140" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="690.0" y="770.2" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Empleo público</text>
<text x="690.0" y="813.6" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">Personas idóneas; participación, rendición de cuentas y evaluación de</text>
<text x="690.0" y="839.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">resultados (Ley 10159, art. 4).</text>
<ellipse cx="110" cy="1020" rx="70" ry="85" fill="none" stroke="#111" stroke-width="9"/>
<text x="110.0" y="1034.0" font-size="40" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">5</text>
<rect x="220" y="950" width="940" height="140" rx="14" fill="white" stroke="#111" stroke-width="3"/>
<text x="690.0" y="995.2" font-size="26" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Responsabilidad</text>
<text x="690.0" y="1038.5" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">La institución responde por su funcionamiento (LGAP, art. 190); la persona</text>
<text x="690.0" y="1064.8" font-size="21" font-weight="normal" font-style="normal" text-anchor="middle" fill="#333">servidora, por dolo o culpa grave (LGAP, art. 199).</text>
<text x="600.0" y="1175.0" font-size="23" font-weight="normal" font-style="italic" text-anchor="middle" fill="#111">La cadena termina en la persona servidora que firma una meta.</text></svg>