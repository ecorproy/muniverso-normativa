name: Descargar reglamentos municipales pedidos

# Se ejecuta al subir herramientas/pedidos_reglamentos.json y, mientras queden pedidos, cada hora (retoma donde quedó).
on:
  push:
    paths:
      - herramientas/pedidos_reglamentos.json
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: normativa-escritura
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: ¿Quedan pedidos?
        id: hay
        run: python3 -c "import json,os;p='herramientas/pedidos_reglamentos.json';print('si='+('1' if os.path.exists(p) and json.load(open(p)) else '0'))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.hay.outputs.si == '1'
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        if: steps.hay.outputs.si == '1'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Descargar desde SINALEVI
        if: steps.hay.outputs.si == '1'
        env:
          MINUTOS: "250"
        run: python herramientas/descargar_reglamentos.py
      - name: Guardar cambios
        if: steps.hay.outputs.si == '1'
        run: |
          git config user.name "Muniverso (descarga de reglamentos)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "Reglamentos municipales" herramientas/pedidos_reglamentos.json herramientas/ultimo_pedido_reglamentos.md
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Descarga de reglamentos municipales desde SINALEVI" -m "$(sed -n 3p herramientas/ultimo_pedido_reglamentos.md)"
          git pull -q --rebase origin main && git push
