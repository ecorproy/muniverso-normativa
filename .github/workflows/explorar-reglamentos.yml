name: Explorar reglamentos municipales

# Al subir herramientas/exploracion_reglamentos.json, lista los reglamentos municipales vigentes de SINALEVI que faltan.
on:
  push:
    paths:
      - herramientas/exploracion_reglamentos.json
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: normativa-explorar-reglamentos
  cancel-in-progress: false

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Explorar
        run: python herramientas/explorar_reglamentos.py
      - name: Guardar lista
        run: |
          git config user.name "Muniverso (exploración de SINALEVI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herramientas/candidatos_reglamentos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Exploración de SINALEVI: reglamentos municipales vigentes que faltan"
          git pull -q --rebase origin main && git push
